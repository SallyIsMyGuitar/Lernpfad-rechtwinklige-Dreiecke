<style>

body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;font-size:17px}

<script>
'use strict';
/* ====== Konfiguration ====== */
// Erklärvideos: videoId (YouTube) eintragen -> wird datenschutzfreundlich (youtube-nocookie) eingebettet.
// Ohne videoId erscheint ein Button mit YouTube-Suche zum Suchbegriff.
const VIDEOS={
  s1:{videoId:null,query:'Satz des Pythagoras Herleitung Erklärung Katheten Hypotenuse'},
  s2:{videoId:null,query:'Satz des Pythagoras Hypotenuse und Kathete berechnen'},
  s3:{videoId:null,query:'Umkehrung Satz des Pythagoras rechtwinklig nachweisen'},
  s4:{videoId:null,query:'Satz des Pythagoras gleichschenkliges Dreieck Raute Höhe'},
  s5:{videoId:null,query:'Extremwert quadratische Ergänzung Streckenlänge Satz des Pythagoras'},
  s6:{videoId:null,query:'Raumdiagonale Quader Pyramide Satz des Pythagoras'},
  s7:{videoId:null,query:'Länge einer Strecke Koordinatensystem Betrag Vektor Pythagoras'},
  s8:{videoId:null,query:'Streckenlänge in Abhängigkeit von x Gerade minimale Länge quadratische Ergänzung'}
};
const KEY='lernpfad-rechtwinklige-dreiecke-v1';
const TEACHER=new URLSearchParams(location.search).has('lehrer');

/* ====== Helfer ====== */
const app=document.getElementById('app');
function h(tag,attrs,...kids){const e=document.createElement(tag);for(const [k,v] of Object.entries(attrs||{})){if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v);}for(const c of kids.flat()){if(c==null)continue;e.append(c.nodeType?c:document.createTextNode(c));}return e;}
const rnd=(a,b)=>a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const fmt=(x,d=2)=>Number(x.toFixed(d)).toString().replace('.',',');
// akzeptiert z. B. „12,5“, „,5“, „12.5“, „5 cm“, „25 cm²“
const parseNum=s=>{const t=String(s).trim().replace(/\s*(mm|cm|dm|km|m|LE|FE)?\s*[²³]?$/i,'').replace(/\s+/g,'').replace(',','.');return /^-?(\d+(\.\d*)?|\.\d+)$/.test(t)?parseFloat(t):NaN;};
const once=fn=>{let d=false;return(...a)=>{if(d)return;d=true;return fn(...a);};};

// Notation nach Zeichenkatalog: Strecke AB̅, Länge |AB̅|, Quadratwurzel mit Wurzelstrich, Bruch
const ov=s=>`<span class="ov">${s}</span>`;
const len=s=>`|${ov(s)}|`;
const sq=s=>`√<span class="rad">${s}</span>`;
const fr=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const HALF=fr(1,2);
/* ====== Notation: Vektoren, Punkte, Terme ====== */
const vec=s=>`<span class="vec">${s}</span>`;
const cvec=(a,b)=>`<span class="cv"><span class="cvp">(</span><span class="cvi"><span>${a}</span><span>${b}</span></span><span class="cvp">)</span></span>`;
const nf=(v,d=2)=>fmt(v,d).replace('-','−');
const ptS=(n,x,y)=>`${n}(${nf(x)} | ${nf(y)})`;
const sqp=v=>v<0?`(${nf(v)})²`:`${nf(v)}²`;
// Term aus [Koeffizient, Variable]-Paaren, z. B. poly([1.25,'x²'],[-10,'x'],[40,'']) -> „1,25x² − 10x + 40“
function poly(...cs){let s='';for(const [k,v] of cs){if(Math.abs(k)<1e-9)continue;const ab=Math.abs(k),b=(Math.abs(ab-1)<1e-9&&v?'':nf(ab))+v;if(!s)s=(k<0?'−':'')+b;else s+=(k<0?' − ':' + ')+b;}return s||'0';}
const lin=(m,c)=>poly([m,'x'],[c,'']);
const uniqOpts=(arr,extra=[])=>{const out=[];for(const o of [...arr,...extra]){if(!out.includes(o))out.push(o);if(out.length>=4)break;}return out;};


let state={};
try{state=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){state={};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

/* ====== Merkkästen (Hefteinträge) ====== */
const MERK={
1:{title:'Der Satz des Pythagoras',html:`
<div class="mh">Der Satz des Pythagoras</div>
<p><b>Bezeichnungen im rechtwinkligen Dreieck:</b><br>
Die beiden Seiten am rechten Winkel heißen <b>Katheten</b> (a, b).<br>
Die Seite gegenüber dem rechten Winkel heißt <b>Hypotenuse</b> (c) – sie ist die längste Seite.</p>
<p><b>Satz des Pythagoras:</b> In jedem rechtwinkligen Dreieck ist die Summe der Flächeninhalte der Quadrate über den Katheten gleich dem Flächeninhalt des Quadrats über der Hypotenuse.</p>
<div class="formel">a² + b² = c²</div>
<p><b>Begründung (Ergänzungsfigur):</b> Ein Quadrat mit der Seitenlänge (a + b) enthält vier kongruente rechtwinklige Dreiecke und das Quadrat über der Hypotenuse:<br>
c² = (a + b)² − 4 · ${HALF} · a · b = a² + 2ab + b² − 2ab = a² + b²</p>
<div class="ex"><b>Beispiel 1:</b> Dreieck PQR mit rechtem Winkel bei Q.<br>
Hypotenuse: ${ov('PR')} (liegt gegenüber von Q)<br>
Satz des Pythagoras: ${len('PQ')}² + ${len('QR')}² = ${len('PR')}²</div>
<div class="ex"><b>Beispiel 2:</b> Die Kathetenquadrate haben 9 cm² und 16 cm².<br>
Hypotenusenquadrat: 9 cm² + 16 cm² = 25 cm²</div>`},
2:{title:'Seitenlängen berechnen',html:`
<div class="mh">Seitenlängen im rechtwinkligen Dreieck berechnen</div>
<p><b>Vorgehen:</b> 1. Beschriftete <b>Skizze</b> anfertigen, rechten Winkel markieren, Hypotenuse bestimmen (sie liegt dem rechten Winkel gegenüber; bei α = 90° ist a die Hypotenuse). Alle Längen in <b>dieselbe Einheit</b> umrechnen. · 2. Satz des Pythagoras anwenden. · 3. Umformen und zusammenfassen. · 4. Wurzel ziehen.</p>
<p><b>Hypotenuse gesucht:</b> &nbsp; c² = a² + b² &nbsp;⇒&nbsp; <b>c = ${sq('a² + b²')}</b></p>
<p><b>Kathete gesucht:</b> &nbsp; a² = c² − b² &nbsp;⇒&nbsp; <b>a = ${sq('c² − b²')}</b> &nbsp; (entsprechend b = ${sq('c² − a²')})</p>
<p>Es geht um Strecken, also gibt es <b>keine negative Lösung</b>. Ist das Ergebnis keine Quadratzahl: Taschenrechner benutzen und sinnvoll runden. Probe: Die Hypotenuse ist immer die längste Seite.</p>
<div class="ex"><b>Beispiel 1 (Hypotenuse):</b> γ = 90°; a = 6 cm; b = 8 cm<br>
c² = (6 cm)² + (8 cm)² = 36 cm² + 64 cm² = 100 cm²<br>
c = 10 cm</div>
<div class="ex"><b>Beispiel 2 (Kathete):</b> α = 90°; a = 2,9 dm; b = 21 cm<br>
Hypotenuse ist a; a = 2,9 dm = 29 cm<br>
b² + c² = a² ⇒ c² = (29 cm)² − (21 cm)² = 841 cm² − 441 cm² = 400 cm²<br>
c = 20 cm</div>`},
3:{title:'Umkehrung des Satzes des Pythagoras',html:`
<div class="mh">Umkehrung des Satzes des Pythagoras</div>
<p><b>Umkehrung:</b> Gilt in einem Dreieck für die Seitenlängen a, b und c (c ist die längste Seite) die Gleichung</p>
<div class="formel">a² + b² = c²</div>
<p>so ist das Dreieck <b>rechtwinklig</b>. Der rechte Winkel liegt der längsten Seite c gegenüber.</p>
<p>Gilt die Gleichung nicht, ist das Dreieck <b>nicht rechtwinklig</b>:<br>
a² + b² &gt; c² ⇒ <b>spitzwinkliges</b> Dreieck (γ &lt; 90°)<br>
a² + b² &lt; c² ⇒ <b>stumpfwinkliges</b> Dreieck (γ &gt; 90°)</p>
<p><b>Nachweis in 4 Schritten:</b> 1. längste Seite c bestimmen · 2. a² + b² berechnen · 3. c² berechnen · 4. vergleichen und Antwortsatz schreiben.</p>
<p><b>Pythagoräische Zahlentripel:</b> drei natürliche Zahlen mit a² + b² = c², z. B. (3; 4; 5), (5; 12; 13), (8; 15; 17). Vielfache eines Tripels sind wieder Tripel: (6; 8; 10), (9; 12; 15).</p>
<div class="ex"><b>Beispiel 1:</b> a = 4,5 cm; b = 6 cm; c = 7,5 cm<br>
a² + b² = (4,5 cm)² + (6 cm)² = 20,25 cm² + 36 cm² = 56,25 cm²<br>
c² = (7,5 cm)² = 56,25 cm² ⇒ a² + b² = c²<br>
Das Dreieck ist rechtwinklig.</div>
<div class="ex"><b>Beispiel 2:</b> a = 4 cm; b = 5 cm; c = 7 cm<br>
a² + b² = 16 cm² + 25 cm² = 41 cm²; c² = 49 cm²<br>
41 cm² &lt; 49 cm² ⇒ Das Dreieck ist nicht rechtwinklig (stumpfwinklig).</div>`},
4:{title:'Satz des Pythagoras in ebenen Figuren',html:`
<div class="mh">Satz des Pythagoras in ebenen Figuren</div>
<p>Vorgehen: beschriftete <b>Skizze</b> · <b>rechtwinkliges Teildreieck</b> suchen (Höhe, Diagonale) · bekannte und gesuchte Seite bestimmen · Satz des Pythagoras anwenden · Antwortsatz.</p>
<p><b>Rechteck und Quadrat:</b> Die Diagonale ist die Hypotenuse: d² = a² + b²; beim Quadrat <b>d = a · √2</b>.<br>
<b>Gleichschenkliges Dreieck:</b> Die Höhe auf die Basis halbiert die Basis.<br>
<b>Gleichseitiges Dreieck</b> (Seitenlänge a): <b>h = ${fr('a','2')} · √3</b> &nbsp;und&nbsp; <b>A = ${fr('a²','4')} · √3</b><br>
<b>Raute:</b> Die Diagonalen halbieren sich und stehen senkrecht aufeinander: <span class="nw">a² = (${fr('e','2')})² + (${fr('f','2')})²</span>.<br>
<b>Drachenviereck:</b> Die Diagonalen stehen senkrecht aufeinander; die Symmetrieachse halbiert die andere Diagonale. A = ${HALF} · e · f<br>
<b>Gleichschenkliges Trapez:</b> Die Höhe schneidet an jeder Seite ein rechtwinkliges Dreieck ab.</p>
<div class="ex"><b>Beispiel 1:</b> Gleichschenkliges Dreieck, Schenkel 10 cm, Basis 12 cm<br>
h² = (10 cm)² − (6 cm)² = 100 cm² − 36 cm² = 64 cm² ⇒ h = 8 cm<br>
A = ${HALF} · 12 cm · 8 cm = 48 cm²</div>
<div class="ex"><b>Beispiel 2:</b> Gleichseitiges Dreieck mit a = 6 cm<br>
h² = (6 cm)² − (3 cm)² = 27 cm² ⇒ h = ${fr('6','2')} · √3 cm ≈ 5,20 cm<br>
A = ${fr('(6 cm)²','4')} · √3 = 9 · √3 cm² ≈ 15,59 cm²</div>`},
5:{title:'Funktionale Abhängigkeiten und Extremwerte',html:`
<div class="mh">Funktionale Abhängigkeiten und Extremwerte</div>
<p>Wandern Punkte P<sub>n</sub>, Q<sub>n</sub>, … auf den Seiten einer Figur, hängen Streckenlängen und Flächeninhalte von x ab.</p>
<p><b>Vorgehen:</b><br>
1. Skizze: rechtwinkliges Teildreieck suchen, Katheten in Abhängigkeit von x angeben.<br>
2. Satz des Pythagoras: Term für ${len('P<sub>n</sub>Q<sub>n</sub>')}² aufstellen und vereinfachen.<br>
3. Werte für x angeben: Alle Strecken müssen länger als 0 cm sein und die Punkte auf ihren Seiten liegen.<br>
4. Quadratische Ergänzung: Term in die Form a(x − d)² + e bringen.<br>
5. Ablesen: a &gt; 0 ⇒ <b>kleinster</b> Wert e für x = d; a &lt; 0 ⇒ <b>größter</b> Wert e für x = d.<br>
6. Bei Streckenlängen die Wurzel ziehen: Ein Wurzelterm ist minimal, wenn der Radikand minimal ist. Antwortsatz.</p>
<div class="ex"><b>Beispiel:</b> Quadrat ABCD mit 8 cm Seitenlänge; ${len('AP<sub>n</sub>')} = ${len('BQ<sub>n</sub>')} = x cm<br>
${len('P<sub>n</sub>B')} = (8 − x) cm; 0 &lt; x &lt; 8<br>
${len('P<sub>n</sub>Q<sub>n</sub>')}² = [(8 − x)² + x²] cm² = (2x² − 16x + 64) cm²<br>
= [2(x² − 8x + 4² − 4²) + 64] cm² = [2(x − 4)² + 32] cm²<br>
Für x = 4 ist die Strecke am kürzesten: ${len('P<sub>n</sub>Q<sub>n</sub>')}<sub>min</sub> = √32 cm ≈ 5,66 cm</div>`},
6:{title:'Satz des Pythagoras in Körpern',html:`
<div class="mh">Satz des Pythagoras in Körpern</div>
<p>Vorgehen: rechtwinkliges <b>Stützdreieck</b> im Körper suchen (in einer Seitenfläche oder im Inneren) und als ebene Skizze herauszeichnen. Oft braucht man zwei Schritte.</p>
<p><b>Quader</b> (Länge a, Breite b, Höhe c):<br>
Flächendiagonale der Grundfläche: e² = a² + b²<br>
Raumdiagonale: d² = e² + c² &nbsp;⇒&nbsp; <b>d = ${sq('a² + b² + c²')}</b></p>
<p><b>Würfel</b> (Kantenlänge a): Flächendiagonale e = a · √2; Raumdiagonale <b>d = a · √3</b></p>
<p><b>Gerade Pyramide</b> mit rechteckiger Grundfläche ABCD (a = ${len('AB')}, b = ${len('BC')}, Höhe h = ${len('MS')}):<br>
Seitenflächenhöhe über a (Dreieck MES): h<sub>a</sub>² = h² + (${fr('b','2')})²<br>
Seitenflächenhöhe über b (Dreieck MFS): h<sub>b</sub>² = h² + (${fr('a','2')})²<br>
Seitenkante (Dreieck AMS): s² = h² + ${len('AM')}² mit ${len('AM')} = ${HALF} · ${len('AC')}<br>
Bei <b>quadratischer</b> Grundfläche ist b = a und h<sub>a</sub> = h<sub>b</sub>; dann auch s² = h<sub>a</sub>² + (${fr('a','2')})² (Dreieck BES).</p>
<div class="ex"><b>Beispiel 1:</b> Quader mit a = 4 cm; b = 3 cm; c = 12 cm<br>
e² = (4 cm)² + (3 cm)² = 25 cm² ⇒ e = 5 cm<br>
d² = (5 cm)² + (12 cm)² = 169 cm² ⇒ d = 13 cm</div>
<div class="ex"><b>Beispiel 2:</b> Quadratische Pyramide mit a = 6 cm; h = 4 cm<br>
h<sub>a</sub>² = (4 cm)² + (3 cm)² = 25 cm² ⇒ h<sub>a</sub> = 5 cm<br>
s² = (5 cm)² + (3 cm)² = 34 cm² ⇒ s ≈ 5,83 cm</div>`},
7:{title:'Strecken im Koordinatensystem',html:`
<div class="mh">Strecken im Koordinatensystem</div>
<p>Im Koordinatensystem gibt man Längen in <b>Längeneinheiten (LE)</b> und Flächeninhalte in <b>Flächeneinheiten (FE)</b> an.</p>
<p><b>Vektor</b> von P(x<sub>P</sub> | y<sub>P</sub>) nach Q(x<sub>Q</sub> | y<sub>Q</sub>) („Spitze minus Fuß“):</p>
<div class="formel">${vec('PQ')} = ${cvec('x<sub>Q</sub> − x<sub>P</sub>','y<sub>Q</sub> − y<sub>P</sub>')}</div>
<p>Die Koordinaten des Vektors sind die Katheten eines rechtwinkligen Dreiecks. Die Länge des Pfeils heißt <b>Betrag</b> des Vektors:</p>
<div class="formel">|${vec('v')}| = ${sq('v<sub>x</sub>² + v<sub>y</sub>²')} &nbsp; für &nbsp; ${vec('v')} = ${cvec('v<sub>x</sub>','v<sub>y</sub>')}</div>
<p><b>Länge der Strecke:</b></p>
<div class="formel">${len('PQ')} = ${sq('(x<sub>Q</sub> − x<sub>P</sub>)² + (y<sub>Q</sub> − y<sub>P</sub>)²')} LE</div>
<p><b>Rechtwinkligkeit prüfen:</b> Die Quadrate aller drei Seitenlängen berechnen. Gilt für die beiden kleineren und das größte Quadrat a² + b² = c², ist das Dreieck rechtwinklig (Umkehrung des Satzes des Pythagoras). Der rechte Winkel liegt der längsten Seite gegenüber.<br>
<b>Gleichschenklig</b> ist ein Dreieck, wenn zwei Seiten gleich lang sind. Bei Vierecken vergleicht man ebenso Seiten- und Diagonalenlängen (z. B. Raute: vier gleich lange Seiten).</p>
<div class="ex"><b>Beispiel 1:</b> P(1 | 2); Q(5 | 5)<br>
${vec('PQ')} = ${cvec('5 − 1','5 − 2')} = ${cvec(4,3)}<br>
${len('PQ')} = ${sq('4² + 3²')} LE = 5 LE</div>
<div class="ex"><b>Beispiel 2:</b> A(−2 | 3); B(2 | 1); C(5 | 7)<br>
${len('AB')}² = [4² + (−2)²] LE² = 20 LE²; ${len('BC')}² = (3² + 6²) LE² = 45 LE²; ${len('AC')}² = (7² + 4²) LE² = 65 LE²<br>
20 + 45 = 65 ⇒ Das Dreieck ist rechtwinklig, der rechte Winkel liegt bei B.</div>`},
8:{title:'Streckenlänge in Abhängigkeit von x',html:`
<div class="mh">Streckenlänge in Abhängigkeit von x</div>
<p>Liegen Punkte P<sub>n</sub> auf einer Geraden g, z. B. y = 0,5x + 1, so gilt P<sub>n</sub>(x | 0,5x + 1). Die Länge der Strecken zu einem festen Punkt Q hängt von x ab.</p>
<p><b>Vorgehen:</b><br>
1. Vektor aufstellen: ${vec('QP<sub>n</sub>')}(x) = Spitze minus Fuß.<br>
2. Satz des Pythagoras: ${len('QP<sub>n</sub>')}² = (x-Koordinate)² + (y-Koordinate)², mit den binomischen Formeln vereinfachen.<br>
3. Quadratische Ergänzung: Term in die Form a(x − d)² + e bringen.<br>
4. Für x = d ist die Strecke am kürzesten: ${len('QP<sub>0</sub>')} = √e LE (ein Wurzelterm ist minimal, wenn der Radikand minimal ist). Koordinaten von P<sub>0</sub> mit der Geradengleichung berechnen.<br>
Die kürzeste Strecke steht <b>senkrecht</b> auf der Geraden g.<br>
Sollen zwei Strecken gleich lang sein (z. B. gleichschenkliges Dreieck, Raute wird zum Quadrat), setzt man die Terme gleich und löst die Gleichung.</p>
<div class="ex"><b>Beispiel:</b> g: y = 0,5x + 1; Q(6 | −1)<br>
${vec('QP<sub>n</sub>')}(x) = ${cvec('x − 6','0,5x + 1 − (−1)')} = ${cvec('x − 6','0,5x + 2')}<br>
${len('QP<sub>n</sub>')}² = [(x − 6)² + (0,5x + 2)²] LE² = (1,25x² − 10x + 40) LE²<br>
= [1,25(x² − 8x + 4² − 4²) + 40] LE² = [1,25(x − 4)² + 20] LE²<br>
Für x = 4 ist die Strecke am kürzesten: ${len('QP<sub>0</sub>')} = √20 LE ≈ 4,47 LE mit P<sub>0</sub>(4 | 3)</div>`},
10:{title:'Kathetensatz und Höhensatz',html:`
<div class="mh">Kathetensatz und Höhensatz (Zusatz)</div>
<p>Im rechtwinkligen Dreieck ABC (γ = 90°) teilt der Höhenfußpunkt D die Hypotenuse c in die <b>Hypotenusenabschnitte</b> p = ${len('BD')} (an der Kathete a) und q = ${len('AD')} (an der Kathete b). Es gilt c = p + q.</p>
<p><b>Kathetensatz:</b> Der Flächeninhalt des Quadrats über einer Kathete ist gleich dem Flächeninhalt des Rechtecks aus der Hypotenuse und dem anliegenden Hypotenusenabschnitt.</p>
<div class="formel">a² = c · p &nbsp;&nbsp; und &nbsp;&nbsp; b² = c · q</div>
<p><b>Höhensatz:</b> Der Flächeninhalt des Quadrats über der Höhe ist gleich dem Flächeninhalt des Rechtecks aus den beiden Hypotenusenabschnitten.</p>
<div class="formel">h² = p · q</div>
<div class="ex"><b>Beispiel:</b> p = 16 cm; h = 12 cm<br>
Höhensatz: (12 cm)² = 16 cm · q ⇒ q = 144 cm² : 16 cm = 9 cm ⇒ c = 25 cm<br>
Kathetensatz: a² = 25 cm · 16 cm = 400 cm² ⇒ a = 20 cm<br>
Satz des Pythagoras: b² = (25 cm)² − (20 cm)² = 225 cm² ⇒ b = 15 cm</div>`}
};

/* ====== Zeichnen: Winkelbogen (Zeichenkatalog: rechter Winkel = Bogen mit Punkt) ====== */
// V Scheitel, u1/u2 Einheitsvektoren der Schenkel (SVG-Koordinaten), r Radius, dot: Punkt für rechten Winkel
function angMark(V,u1,u2,r,dot,sw,col='#111'){
  const P1=[V[0]+u1[0]*r,V[1]+u1[1]*r],P2=[V[0]+u2[0]*r,V[1]+u2[1]*r];
  const sweep=(u1[0]*u2[1]-u1[1]*u2[0])>0?1:0;
  let g=`<path d="M${P1[0]},${P1[1]} A${r},${r} 0 0 ${sweep} ${P2[0]},${P2[1]}" fill="none" stroke="${col}" stroke-width="${sw}"/>`;
  if(dot){const bx=u1[0]+u2[0],by=u1[1]+u2[1],bl=Math.hypot(bx,by)||1;g+=`<circle cx="${V[0]+bx/bl*r*.5}" cy="${V[1]+by/bl*r*.5}" r="${r*.11}" fill="${col}"/>`;}
  return g;
}

/* ====== Zeichnen: Dreieck mit Beschriftung ====== */
function triSvg(o){
  const L1=o.L1||4,L2=o.L2||3;
  let P=[[0,0],[L1,0],[0,L2]];
  if(o.mirror)P=P.map(([x,y])=>[-x,y]);
  const r=(o.rot||0)*Math.PI/180,c=Math.cos(r),s=Math.sin(r);
  P=P.map(([x,y])=>[x*c-y*s,-(x*s+y*c)]);
  const cen=[(P[0][0]+P[1][0]+P[2][0])/3,(P[0][1]+P[1][1]+P[2][1])/3];
  const away=(pt,d)=>{const dx=pt[0]-cen[0],dy=pt[1]-cen[1],l=Math.hypot(dx,dy)||1;return[pt[0]+dx/l*d,pt[1]+dy/l*d];};
  const S=[[0,1],[0,2],[1,2]];
  const xs=P.map(p=>p[0]),ys=P.map(p=>p[1]);
  let minx=Math.min(...xs)-2.8,maxx=Math.max(...xs)+2.8,miny=Math.min(...ys)-1.8,maxy=Math.max(...ys)+1.8;
  if(maxx-minx<11){const d=(11-(maxx-minx))/2;minx-=d;maxx+=d;}
  if(maxy-miny<7){const d=(7-(maxy-miny))/2;miny-=d;maxy+=d;}
  const u=(a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy);return[dx/l,dy/l];};
  const u1=u(P[0],P[1]),u2=u(P[0],P[2]);
  let g=`<polygon points="${P.map(p=>p.join(',')).join(' ')}" fill="#eef4ff" stroke="#1f2937" stroke-width=".08"/>`+angMark(P[0],u1,u2,.62,true,.06,'#1f2937');
  if(o.labels)S.forEach((sd,i)=>{if(o.labels[i]==null)return;const m=[(P[sd[0]][0]+P[sd[1]][0])/2,(P[sd[0]][1]+P[sd[1]][1])/2];const q=away(m,.7);g+=`<text x="${q[0]}" y="${q[1]}" font-size=".52" text-anchor="middle" dominant-baseline="middle" fill="#111">${o.labels[i]}</text>`;});
  if(o.vertex)P.forEach((p,i)=>{const q=away(p,.75);g+=`<text x="${q[0]}" y="${q[1]}" font-size=".66" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1e3a8a">${o.vertex[i]}</text>`;});
  if(o.clickable)S.forEach((sd,i)=>{g+=`<line class="hit" data-side="${i}" x1="${P[sd[0]][0]}" y1="${P[sd[0]][1]}" x2="${P[sd[1]][0]}" y2="${P[sd[1]][1]}"/>`;});
  return `<svg class="fig" style="width:${o.w||360}px" viewBox="${minx} ${miny} ${maxx-minx} ${maxy-miny}" xmlns="http://www.w3.org/2000/svg">${g}</svg>`;
}

/* ====== Zeichnen: Dreieck mit Quadraten (Experiment) ====== */
function squaresSvg(a,b,gdeg){
  const g=gdeg*Math.PI/180;
  const C=[0,0],B=[a,0],A=[b*Math.cos(g),b*Math.sin(g)];
  const sq=(Pp,Q,R)=>{const dx=Q[0]-Pp[0],dy=Q[1]-Pp[1];let nx=-dy,ny=dx;const mx=(Pp[0]+Q[0])/2,my=(Pp[1]+Q[1])/2;if((R[0]-mx)*nx+(R[1]-my)*ny>0){nx=-nx;ny=-ny;}return[Pp,Q,[Q[0]+nx,Q[1]+ny],[Pp[0]+nx,Pp[1]+ny]];};
  const fl=p=>[p[0],-p[1]];
  const sa=sq(C,B,A).map(fl),sb=sq(C,A,B).map(fl),sc=sq(B,A,C).map(fl);
  const tri=[C,B,A].map(fl);
  const all=[...sa,...sb,...sc,...tri];
  const xs=all.map(p=>p[0]),ys=all.map(p=>p[1]);
  const pad=1,minx=Math.min(...xs)-pad,maxx=Math.max(...xs)+pad,miny=Math.min(...ys)-pad,maxy=Math.max(...ys)+pad;
  const W=maxx-minx,H=maxy-miny,fs=Math.max(W,H)/26;
  const poly=(q,col)=>`<polygon points="${q.map(p=>p.join(',')).join(' ')}" fill="${col}" fill-opacity=".35" stroke="${col}" stroke-width="${fs/10}"/>`;
  const ctr=q=>[(q[0][0]+q[2][0])/2,(q[0][1]+q[2][1])/2];
  const lab=(q,t)=>{const c=ctr(q);return `<text x="${c[0]}" y="${c[1]}" font-size="${fs}" text-anchor="middle" dominant-baseline="middle" fill="#111" font-weight="600">${t}</text>`;};
  const c2=a*a+b*b-2*a*b*Math.cos(g);
  const f=x=>fmt(x,1);
  let svg=poly(sa,'#2563eb')+poly(sb,'#16a34a')+poly(sc,'#ea580c');
  svg+=`<polygon points="${tri.map(p=>p.join(',')).join(' ')}" fill="#fff" stroke="#111" stroke-width="${fs/9}"/>`;
  svg+=lab(sa,'a² = '+f(a*a))+lab(sb,'b² = '+f(b*b))+lab(sc,'c² = '+f(c2));
  svg+=angMark([0,0],[1,0],[Math.cos(g),-Math.sin(g)],Math.min(a,b)*.25,Math.abs(gdeg-90)<.01,fs/10);
  return {svg:`<svg class="fig" style="width:100%;max-width:520px" viewBox="${minx} ${miny} ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${svg}</svg>`,c2};
}

/* ====== Zeichnen: Ergänzungsfigur (Begründung des Satzes) ====== */
function proofSvg(){
  const a=3,b=4,S=a+b,ox=S+2.2,fs=.62;
  const pg=(pts,col,dx=0,op=.55)=>`<polygon points="${pts.map(([x,y])=>(x+dx)+','+y).join(' ')}" fill="${col}" fill-opacity="${op}" stroke="#1f2937" stroke-width=".06"/>`;
  const tx=(x,y,t,col='#111',w=600)=>`<text x="${x}" y="${y}" font-size="${fs}" text-anchor="middle" dominant-baseline="middle" fill="${col}" font-weight="${w}">${t}</text>`;
  const T='#fca5a5';
  let g='';
  // linke Figur: vier Dreiecke, Quadrat über der Hypotenuse bleibt frei
  [[[0,0],[a,0],[0,b]],[[S,0],[S,a],[a,0]],[[S,S],[b,S],[S,a]],[[0,S],[0,b],[b,S]]].forEach(t=>g+=pg(t,T));
  g+=pg([[a,0],[S,a],[b,S],[0,b]],'#fdba74',0,.7)+tx(S/2,S/2,'c²','#9a3412',700);
  g+=tx(a/2,-.45,'a')+tx(a+b/2,-.45,'b')+tx(S+.45,a/2,'a')+tx(S+.45,a+b/2,'b')+tx(S-a/2,S+.5,'a')+tx(b/2,S+.5,'b')+tx(-.45,S-a/2,'a')+tx(-.45,b/2,'b');
  g+=tx((a+S)/2-.35,a/2-.35,'c','#9a3412')+tx(a/2-.25,b/2-.4,'c','#9a3412');
  // rechte Figur: vier Dreiecke als zwei Rechtecke, Quadrate über den Katheten bleiben frei
  [[[a,0],[S,0],[S,a]],[[a,0],[a,a],[S,a]],[[0,a],[a,a],[0,S]],[[a,a],[a,S],[0,S]]].forEach(t=>g+=pg(t,T,ox));
  g+=pg([[0,0],[a,0],[a,a],[0,a]],'#93c5fd',ox,.7)+pg([[a,a],[S,a],[S,S],[a,S]],'#86efac',ox,.7);
  g+=tx(ox+a/2,a/2,'a²','#1e3a8a',700)+tx(ox+a+b/2,a+b/2,'b²','#166534',700);
  g+=tx(ox+a/2,-.45,'a')+tx(ox+a+b/2,-.45,'b')+tx(ox-.45,a/2,'a')+tx(ox-.45,a+b/2,'b');
  g+=tx(S/2,S+1.35,'Figur 1','#374151')+tx(ox+S/2,S+1.35,'Figur 2','#374151');
  return `<svg class="fig" style="width:100%;max-width:560px" viewBox="-1.2 -1.2 ${ox+S+2} ${S+3.2}" xmlns="http://www.w3.org/2000/svg">${g}</svg>`;
}

/* ====== Bausteine ====== */
function mc(body,o,onOk,onBad){
  const box=h('div',{class:'q'},h('p',{class:'qt',html:o.q}));
  const fb=h('div',{class:'fb','aria-live':'polite'}),list=h('div',{class:'opts'});
  const order=shuffle(o.options.map((_,i)=>i));
  order.forEach(i=>{
    const b=h('button',{class:'opt',type:'button',html:o.options[i]});
    b.addEventListener('click',()=>{
      if(b.disabled)return;
      if(i===o.correct){b.classList.add('ok');[...list.children].forEach(x=>x.disabled=true);fb.className='fb ok';fb.innerHTML='✓ Richtig. '+(o.explain||'');onOk&&onOk();}
      else{b.classList.add('bad');b.disabled=true;fb.className='fb bad';fb.innerHTML='Noch nicht. '+(o.hint||'Überlege noch einmal.');onBad&&onBad();}
    });
    list.append(b);
  });
  box.append(list,fb);body.append(box);return box;
}
function numQ(body,o,onOk,onBad){
  const tol=o.tol==null?0.0051:o.tol;
  const inp=h('input',{class:'num',type:'text',inputmode:'decimal',autocomplete:'off',placeholder:'Ergebnis'});
  const fb=h('div',{class:'fb','aria-live':'polite'});
  const btn=h('button',{class:'btn',type:'button'},'Prüfen');
  const check=()=>{
    if(inp.disabled)return;
    const v=parseNum(inp.value);
    if(isNaN(v)){fb.className='fb bad';fb.textContent='Bitte eine Zahl eingeben (z. B. 12,5).';return;}
    if(Math.abs(v-o.answer)<=tol){inp.disabled=true;btn.disabled=true;fb.className='fb ok';fb.innerHTML='✓ Richtig. '+(o.explain||'');onOk&&onOk();}
    else{fb.className='fb bad';let m=o.hint||'Noch nicht. Rechne noch einmal nach.';if(tol<0.01&&!Number.isInteger(o.answer)&&Math.abs(v-o.answer)<0.06)m='Fast! Runde auf zwei Nachkommastellen.';fb.innerHTML=m;onBad&&onBad();}
  };
  btn.addEventListener('click',check);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
  const box=h('div',{class:'q'},h('p',{class:'qt',html:o.q}),h('div',{},inp,' ',o.unit||'',' ',btn),fb);
  body.append(box);return box;
}
function nextBtn(body,label,fn){const b=h('button',{class:'btn',type:'button'},label);b.addEventListener('click',()=>{b.disabled=true;fn();});body.append(b);return b;}
function videoBlock(body,key,text){
  const v=VIDEOS[key];
  const box=h('div',{class:'info'},h('div',{html:text}));
  if(v.videoId){box.append(h('div',{html:`<iframe style="width:100%;aspect-ratio:16/9;border:0;border-radius:10px;margin-top:8px" src="https://www.youtube-nocookie.com/embed/${v.videoId}" allowfullscreen loading="lazy"></iframe>`}));}
  else box.append(h('a',{class:'btn',style:'display:inline-block;text-decoration:none;margin-top:8px',target:'_blank',rel:'noopener',href:'https://www.youtube.com/results?search_query='+encodeURIComponent(v.query)},'▶ Erklärvideo auf YouTube suchen'));
  body.append(box);
}
function merkStep(n){
  return {title:'✏️ Merkheft-Eintrag',render(body,done){
    body.append(h('p',{},'Schreibe den folgenden Kasten vollständig in dein Merkheft (Überschrift, Text, Formel und Beispiele).'));

/* ====== Übungs-Baustein mit 3 Niveaus ====== */
const NIV_NAMES={leicht:'leicht',standard:'standard',plus:'plus'};
function nivText(c){if(!c)return '';const p=Object.keys(NIV_NAMES).filter(k=>c[k]).map(k=>`${c[k]}× ${NIV_NAMES[k]}`);return p.join(', ');}
function practice(body,n,gens,need,done){
  let niv='leicht',solved=0,fin=false;
  state.niv=state.niv||{};const cnts={leicht:0,standard:0,plus:0,...(state.niv[n]||{})};
  const tabs=h('div',{class:'tabs'}),area=h('div'),cnt=h('div',{class:'muted'});
  const names={leicht:'🟢 leicht',standard:'🟡 standard',plus:'🔴 plus'};
  Object.keys(names).forEach(k=>{const t=h('button',{class:'tab'+(k===niv?' on':''),type:'button'},names[k]);t.addEventListener('click',()=>{niv=k;[...tabs.children].forEach(x=>x.classList.remove('on'));t.classList.add('on');newTask();});tabs.append(t);});
  body.append(h('p',{class:'muted'},`Löse mindestens ${need} Aufgaben richtig. Wähle dein Niveau – du kannst jederzeit wechseln. Eine Aufgabe zählt, wenn du sie ohne Lösungsweg schaffst (Auswahlaufgaben im 1. Versuch, Rechenaufgaben spätestens im 2. Versuch). Tipps sind erlaubt.`),tabs,area,cnt);
  const upd=()=>{cnt.textContent=`✓ ${solved} von ${need} gezählten Aufgaben gelöst`;};
  function newTask(){
    const t=gens[niv]();let tries=0,hintN=0,ok=false,solShown=false;const tNiv=niv;
    if(t.prompt&&t.prompt.includes('<svg')&&!t.exact)t.prompt+='<p class="muted" style="text-align:center;margin:0">Skizze nicht maßstabsgetreu</p>';
    area.innerHTML='';
    const q=h('div'),hints=h('div'),sol=h('div'),act=h('div');
    area.append(q,act,hints,sol);
    const solveBtn=h('button',{class:'btn sec',type:'button',style:'display:none'},'Lösungsweg anzeigen');
    const hintBtn=h('button',{class:'btn sec',type:'button'},'💡 Tipp');
    const nxt=h('button',{class:'btn',type:'button',style:'display:none'},'Nächste Aufgabe →');
    const showSol=()=>{sol.innerHTML='';sol.append(h('div',{class:'sol',html:t.solution}));};
    hintBtn.addEventListener('click',()=>{if(hintN<t.hints.length){hints.append(h('div',{class:'hint',html:'💡 '+t.hints[hintN++]}));}if(hintN>=t.hints.length)hintBtn.disabled=true;});
    solveBtn.addEventListener('click',()=>{solShown=true;showSol();nxt.style.display='';solveBtn.disabled=true;hintBtn.disabled=true;q.querySelectorAll('input,button').forEach(x=>x.disabled=true);});
    nxt.addEventListener('click',newTask);
    const onOk=()=>{if(ok||solShown)return;ok=true;
      const counts=t.kind==='mc'?tries===0:tries<=1;
      if(counts){solved++;cnts[tNiv]++;state.niv[n]={...cnts};save();upd();}
      else area.append(h('div',{class:'fb','aria-live':'polite'},'Richtig – diese Aufgabe zählt aber nicht, weil du mehrere Versuche gebraucht hast. Schau dir den Lösungsweg an und probiere die nächste.'));
      showSol();nxt.style.display='';hintBtn.disabled=true;solveBtn.style.display='none';
      if(solved>=need&&!fin){fin=true;area.append(h('div',{class:'fb ok'},'🎉 Geschafft! Du kannst unten mit dem Exit-Ticket weitermachen oder weiter üben.'));done();}};
    const onBad=()=>{tries++;if(tries>=2||t.kind==='mc')solveBtn.style.display='';};
    q.append(h('div',{html:t.prompt}));
    if(t.kind==='mc')mc(q,{q:t.question,options:t.options,correct:t.correct,hint:t.badHint},onOk,onBad);
    else numQ(q,{q:t.question,answer:t.answer,tol:t.tol,unit:t.unit,hint:t.badHint},onOk,onBad);
    act.append(hintBtn,solveBtn,nxt);
  }
  upd();newTask();
}

/* ====== Exit-Ticket ====== */
// Kontrollcode: Plausibilitätscheck (Station, Punktzahl, Datum) – kein Manipulationsschutz
function codeFor(n,score,d){return String(((n*7919)+(score*104729)+((d.getMonth()+1)*31+d.getDate())*131)%9000+1000);}
// pools: pro Frage ein Array von Varianten; correct ist immer options[0] (Anzeige wird gemischt)
function exitTicket(body,n,pools,done){
  let idx=0,score=0,qs=[],log=[];
  const box=h('div');body.append(box);
  function start(){idx=0;score=0;log=[];qs=shuffle(pools.map(p=>pick(p)));show();}
  function show(){
    box.innerHTML='';
    if(idx>=qs.length)return finish();
    const q=qs[idx];
    box.append(h('p',{class:'muted'},`Frage ${idx+1} von ${qs.length} · Du hast pro Frage nur einen Versuch.`));
    const qb=h('div',{class:'q'},h('p',{class:'qt',html:q.q}));
    const list=h('div',{class:'opts'}),fb=h('div',{class:'fb','aria-live':'polite'});
    shuffle(q.options.map((_,i)=>i)).forEach(i=>{
      const b=h('button',{class:'opt',type:'button',html:q.options[i]});
      b.addEventListener('click',()=>{
        if(b.disabled)return;[...list.children].forEach(x=>x.disabled=true);
        const ok=i===0;if(ok)score++;log.push({q,chosen:i,ok});
        b.classList.add(ok?'ok':'bad');fb.className='fb '+(ok?'ok':'bad');fb.textContent=ok?'✓ Richtig.':'✗ Leider falsch. Die Lösung siehst du in der Auswertung.';
        nextBtn(box,idx<qs.length-1?'Weiter →':'Auswerten',()=>{idx++;show();});
      });
      list.append(b);
    });
    qb.append(list,fb);box.append(qb);
  }
  function finish(){
    const pass=score>=2;
    box.append(h('h3',{},`Ergebnis: ${score} von ${qs.length}`));
    const rev=h('div',{class:'card',style:'margin:8px 0'},h('p',{class:'qt'},'Auswertung'));
    log.forEach((e,k)=>rev.append(h('div',{class:'q'},
      h('div',{html:`<b>${k+1}.</b> ${e.q.q}`}),
      h('div',{class:e.ok?'fb ok':'fb bad',html:(e.ok?'✓ ':'✗ Deine Antwort: '+e.q.options[e.chosen]+'<br>Richtig: ')+e.q.options[0]}),
      h('div',{class:'muted',html:e.q.explain}))));
    box.append(rev);
    if(pass){
      const d=new Date(),code=codeFor(n,score,d),nv=nivText(state.niv&&state.niv[n]);
      state[n]={score,date:d.toLocaleDateString('de-DE'),code,niv:nv};save();
      box.append(h('div',{class:'checkin'},h('div',{html:`<b>${STATIONS[n].zusatz?'Zusatzstation':'Station '+n} geschafft!</b> – ${STATIONS[n].title}`}),h('div',{},`Exit-Ticket: ${score} von ${qs.length} · Datum: ${state[n].date}`),nv?h('div',{},`Geübt: ${nv}`):null,h('div',{html:`Kontrollcode: <span class="code">${code}</span>`}),h('div',{class:'muted'},'Zeige diese Karte deiner Lehrkraft (oder mache einen Screenshot).')));
      done();
    }else{
      box.append(h('p',{},'Noch nicht ganz. Lies die Auswertung, schau dir die Erklärungen oben noch einmal an und übe weiter. Beim nächsten Versuch bekommst du neue Fragen.'));
      nextBtn(box,'Exit-Ticket wiederholen',start);
    }
  }
  start();
}

  const b2=c*c-a*a;return `<div>Kathete gesucht: b² = c² − a²</div><div>b² = ${fmt(c)}² − ${fmt(a)}² = ${r(c*c)} − ${r(a*a)} = ${r(b2)}</div><div>b = √${r(b2)} ≈ <b>${r(Math.sqrt(b2))} ${u}</b></div>`;

function s2plus(){

/* ====== Experiment (Station 1) ====== */
function experiment(body,done){
  let a=3,b=4,g=90,rows=[];
  const fig=h('div'),info=h('div',{class:'muted'}),tbl=h('div'),fb=h('div',{class:'fb','aria-live':'polite'});

  const angBox=h('div',{style:'display:none'});

    mk('a','Seite a (cm)',1,8,.5,a,v=>{a=v;draw();}),
    mk('b','Seite b (cm)',1,8,.5,b,v=>{b=v;draw();}));

  const add=h('button',{class:'btn',type:'button'},'➕ Messung in Tabelle eintragen');

  function status(){
    const r90=new Set(rows.filter(x=>x.g===90).map(x=>x.a+'/'+x.b)).size,rO=rows.filter(x=>x.g!==90).length;
    if(r90>=3&&!showA){showA=true;angBox.style.display='';fb.className='fb';fb.innerHTML='Neu: Jetzt kannst du den Winkel γ verändern. Trage mindestens 2 Messungen mit einem Winkel ungleich 90° ein.';}
    go.disabled=!(r90>=3&&rO>=2);
    if(!go.disabled)fb.innerHTML='Gut! Vergleiche in der Tabelle die Spalten „a² + b²“ und „c²“. Was fällt dir auf? Klicke dann auf „Fertig – weiter“.';
  }
  let showA=false;
  function table(){
    tbl.innerHTML='';if(!rows.length)return;
    const t=h('table',{class:'t'},h('tr',{},...['a','b','γ','a²','b²','a² + b²','c²','gleich?'].map(x=>h('th',{},x))));
    rows.forEach(x=>t.append(h('tr',{},...[fmt(x.a,1),fmt(x.b,1),x.g+'°',fmt(x.a*x.a,1),fmt(x.b*x.b,1),fmt(x.a*x.a+x.b*x.b,1),fmt(x.c2,1),Math.abs(x.a*x.a+x.b*x.b-x.c2)<.05?'✓':'✗'].map(v=>h('td',{},v)))));
    tbl.append(t);

  go.addEventListener('click',()=>{go.disabled=true;add.disabled=true;done();});
  body.append(h('p',{html:'<b>Auftrag:</b> Zu Beginn hat das Dreieck bei C einen rechten Winkel (γ = 90°). Dann sind a und b die Katheten und c ist die Hypotenuse. Über jeder Seite siehst du ein Quadrat mit seinem Flächeninhalt (in cm²). Verändere a und b und trage <b>mindestens 3 verschiedene Messungen</b> in die Tabelle ein.'}),controls,angBox,fig,info,h('div',{},add,go),fb,tbl);
  draw();
}

/* ====== Geführte Folge (Station 2) ====== */
function guided(body,items,done){
  let i=0;const box=h('div');body.append(box);
  function nxt(){
    if(i>=items.length){done();return;}
    const it=items[i++];
    if(it.html)box.append(h('div',{html:it.html}));
    const ok=()=>setTimeout(nxt,250);
    if(it.type==='mc')mc(box,it,ok);else if(it.type==='num')numQ(box,it,ok);else nxt();
  }
  nxt();
}


/* ====== Station 2: rechter Winkel bei α/β/γ, Einheiten ====== */
function s2winkel(){
  const t=pick(TRIPLES.filter(x=>x[2]<=25)),k=pick([5,10]);
  const v=t.map(x=>x*k);
  const [X,Y,Z]=shuffle(['A','B','C']);
  const gr={A:'α',B:'β',C:'γ'};
  const nm=[Y.toLowerCase(),Z.toLowerCase(),X.toLowerCase()];
  const unk=rint(0,2),given=[0,1,2].filter(i=>i!==unk);
  const fu=(cm,u)=>u==='cm'?fmt(cm,0):u==='dm'?fmt(cm/10,1):fmt(cm/100,2);
  const units=shuffle(['cm',pick(['dm','m'])]);
  const txt=given.map((i,j)=>`${nm[i]} = ${fu(v[i],units[j])} ${units[j]}`);
  const conv=given.map((i,j)=>units[j]==='cm'?null:`${fu(v[i],units[j])} ${units[j]} = ${v[i]} cm`).filter(Boolean);
  const prompt=triSvg({vertex:[X,Y,Z],rot:pick(ROTS),mirror:Math.random()<.5,L1:rnd(3,5),L2:rnd(2.5,4.5)})+`<p class="muted">Die Seite a liegt dem Eckpunkt A gegenüber, b liegt B gegenüber, c liegt C gegenüber.</p>`;
  let calc;
  if(unk===2){const g1=v[given[0]],g2=v[given[1]];calc=`${nm[2]}² = ${g1}² + ${g2}² = ${g1*g1} + ${g2*g2} = ${g1*g1+g2*g2}`;}
  else{const hy=v[2],kn=v[given.find(i=>i!==2)];calc=`${nm[unk]}² = ${hy}² − ${kn}² = ${hy*hy} − ${kn*kn} = ${hy*hy-kn*kn}`;}
  return {kind:'num',unit:'cm',prompt,tol:.001,answer:v[unk],
    question:`Im Dreieck ABC ist ${gr[X]} = 90°. Es gilt ${txt.join(' und ')}. Berechne ${nm[unk]} in cm.`,
    badHint:'Welche Seite liegt dem rechten Winkel gegenüber? Sind alle Längen in derselben Einheit?',
    hints:[`Der rechte Winkel liegt bei ${X}. Die Hypotenuse liegt gegenüber: ${nm[2]}.`,'Rechne zuerst alle Längen in cm um.'],
    solution:`<div>Rechter Winkel bei ${X} (${gr[X]} = 90°) ⇒ Hypotenuse <b>${nm[2]}</b></div>${conv.map(c=>`<div>${c}</div>`).join('')}<div>${calc}</div><div>${nm[unk]} = √${unk===2?v[unk]*v[unk]:v[unk]*v[unk]} = <b>${v[unk]} cm</b></div>`};
}

/* ====== Station 3: Umkehrung ====== */
function s3text(dec,so,f){
  const [a,b,c]=so,u=x=>fmt(x/f,dec?2:0),l=x=>fmt(x/f,dec?1:0);

  return {isR,sol:`<div>Längste Seite: ${l(c)} cm</div><div>(${l(a)} cm)² + (${l(b)} cm)² = ${u(a*a/f)} cm² + ${u(b*b/f)} cm² = <b>${u((a*a+b*b)/f)} cm²</b></div><div>(${l(c)} cm)² = <b>${u(c*c/f)} cm²</b></div><div>${isR?'Beide Werte sind gleich ⇒ rechtwinklig.':(lt?'Die Summe ist kleiner ⇒ nicht rechtwinklig, sondern stumpfwinklig.':'Die Summe ist größer ⇒ nicht rechtwinklig, sondern spitzwinklig.')}</div>`,
    idx:isR?0:(lt?1:2)};
}
function s3len(dec){
  const t=pick(TRIPLES.filter(x=>x[2]<=25)),sc=dec?pick([0.1,0.2,0.5,1.5,2]):pick([1,2]),f=dec?10:1;

  do{s=t.map(x=>Math.round(x*sc*f));right=Math.random()<.5;if(!right){const i=rint(0,2);s[i]+=pick([-2,-1,1,2]);}
     so=[...s].sort((x,y)=>x-y);ok=so[0]>0&&so[0]+so[1]>so[2]&&((so[0]*so[0]+so[1]*so[1]===so[2]*so[2])===right);}while(!ok);
  const r=s3text(dec,so,f),mm=dec&&Math.random()<.4?rint(0,2):-1,sh=shuffle(s);
  const show=sh.map((x,i)=>i===mm?fmt(x*10/f,0)+' mm':fmt(x/f,dec?1:0)+' cm').join('; ');
  if(mm>=0)r.sol=`<div>Einheiten angleichen: ${fmt(sh[mm]*10/f,0)} mm = ${fmt(sh[mm]/f,1)} cm</div>`+r.sol;

const A9MAX=A9.reduce((s,t)=>s+t.pts,0),A9PASS=Math.ceil(A9MAX/2);

function abschluss(body,done){
  const box=h('div');body.append(box);let tasks=[],idx=0;
  function start(){tasks=A9.map(a=>({...a.gen(),st:a.st,pts:a.pts}));idx=0;show();}
  function show(){
    box.innerHTML='';if(idx>=tasks.length)return finish();
    const t=tasks[idx];
    box.append(h('div',{class:'pb'},h('i',{style:`width:${idx/tasks.length*100}%`})),
      h('p',{class:'muted'},`Aufgabe ${idx+1} von ${tasks.length} · ${t.pts} ${t.pts===1?'Punkt':'Punkte'} · Du hast nur einen Versuch. Ob deine Antwort stimmt, siehst du in der Auswertung.`));
    if(t.prompt)box.append(h('div',{html:t.prompt+(t.prompt.includes('<svg')&&!t.exact?'<p class="muted" style="text-align:center;margin:0">Skizze nicht maßstabsgetreu</p>':'')}));
    const qb=h('div',{class:'q'},h('p',{class:'qt',html:t.question}));box.append(qb);
    const nxt=()=>nextBtn(box,idx<tasks.length-1?'Weiter →':'Auswerten',()=>{idx++;show();});
    if(t.kind==='mc'){
      const list=h('div',{class:'opts'});
      shuffle(t.options.map((_,i)=>i)).forEach(i=>{const b=h('button',{class:'opt',type:'button',html:t.options[i]});
        b.addEventListener('click',()=>{if(b.disabled)return;[...list.children].forEach(x=>x.disabled=true);b.classList.add('sel');t.given=t.options[i];t.ok=i===t.correct;nxt();});list.append(b);});
      qb.append(list);
    }else{
      const inp=h('input',{class:'num',type:'text',inputmode:'decimal',autocomplete:'off',placeholder:'Ergebnis'}),fb=h('div',{class:'fb','aria-live':'polite'});
      const btn=h('button',{class:'btn',type:'button'},'Antwort abgeben');
      const sub=()=>{if(inp.disabled)return;const v=parseNum(inp.value);if(isNaN(v)){fb.className='fb bad';fb.textContent='Bitte eine Zahl eingeben (z. B. 12,5).';return;}
        inp.disabled=true;btn.disabled=true;fb.className='fb';fb.textContent='Antwort gespeichert.';t.given=nf(v)+(t.unit?' '+t.unit:'');t.ok=Math.abs(v-t.answer)<=t.tol;nxt();};
      btn.addEventListener('click',sub);inp.addEventListener('keydown',e=>{if(e.key==='Enter')sub();});
      qb.append(h('div',{},inp,' ',t.unit||'',' ',btn),fb);setTimeout(()=>inp.focus(),50);
    }
    if(idx>0)box.scrollIntoView({behavior:'smooth',block:'start'});
  }
  function finish(){
    const score=tasks.reduce((s,t)=>s+(t.ok?t.pts:0),0),pass=score>=A9PASS;
    box.append(h('h3',{},`Ergebnis: ${score} von ${A9MAX} Punkten`));
    const per={};tasks.forEach(t=>{per[t.st]=per[t.st]||{p:0,m:0};per[t.st].m+=t.pts;if(t.ok)per[t.st].p+=t.pts;});
    const tb=h('table',{class:'t'},h('tr',{},h('th',{},'Station'),h('th',{},'Punkte'),h('th',{},'Empfehlung')));
    const weak=[];Object.keys(per).forEach(k=>{const v=per[k],full=v.p===v.m;if(!full)weak.push(k);
      tb.append(h('tr',{},h('td',{style:'text-align:left'},`${k}: ${ST_SHORT[k]}`),h('td',{},`${v.p} / ${v.m}`),h('td',{class:full?'fb ok':'fb bad'},full?'✓ sicher':`Wiederhole Station ${k} (Merkkasten, Üben)`)));});
    box.append(h('div',{class:'card',style:'margin:8px 0'},h('p',{class:'qt'},'Auswertung nach Stationen'),tb,
      h('p',{class:'muted',style:'margin-bottom:0'},weak.length?`Tipp: Lies zuerst die Merkkästen der Stationen ${weak.join(', ')} im Merkheft nach und löse dort noch einmal Übungsaufgaben.`:'Hervorragend – alle Stationen sicher!')));
    const rev=h('div',{class:'card',style:'margin:8px 0'},h('p',{class:'qt'},'Alle Aufgaben mit Lösungsweg'));
    tasks.forEach((t,k)=>{const det=h('details',{},h('summary',{html:`<b>${k+1}.</b> ${t.ok?'✓':'✗'} Station ${t.st} · ${t.ok?t.pts:0} / ${t.pts} ${t.pts===1?'Punkt':'Punkte'}`}),
      h('div',{html:t.question}),h('div',{class:t.ok?'fb ok':'fb bad',html:`Deine Antwort: ${t.given}`+(t.ok?'':`<br>Richtig: ${t.kind==='mc'?t.options[t.correct]:nf(t.answer)+(t.unit?' '+t.unit:'')}`)}),h('div',{class:'sol',html:t.solution}));
      if(!t.ok)det.open=true;rev.append(h('div',{class:'q'},det));});
    box.append(rev);
    if(pass){
      const d=new Date(),code=codeFor(9,score,d);
      state[9]={score,date:d.toLocaleDateString('de-DE'),code,niv:''};save();
      box.append(h('div',{class:'checkin'},h('div',{html:`<b>Abschluss-Check geschafft!</b> – Rechtwinklige Dreiecke`}),h('div',{},`Ergebnis: ${score} von ${A9MAX} Punkten · Datum: ${state[9].date}`),h('div',{html:`Kontrollcode: <span class="code">${code}</span>`}),h('div',{class:'muted'},'Zeige diese Karte deiner Lehrkraft (oder mache einen Screenshot).')));
      done();
    }else{
      box.append(h('p',{},`Du brauchst mindestens ${A9PASS} Punkte. Wiederhole die empfohlenen Stationen und starte den Abschluss-Check dann neu. Du bekommst neue Aufgaben.`));
      nextBtn(box,'Abschluss-Check wiederholen',start);
    }
    box.scrollIntoView({behavior:'smooth',block:'start'});
  }
  start();
}

 {title:'Auffrischung: quadratische Ergänzung',render(body,done){

 {title:'Die gerade quadratische Pyramide',render(body,done){
   body.append(h('div',{class:'info',html:`Bei einer <b>geraden quadratischen Pyramide</b> liegt die Spitze S senkrecht über dem Diagonalenschnittpunkt M der Grundfläche. E ist der Mittelpunkt der Grundkante ${ov('AB')}.<br>• <b>h</b> = ${len('MS')}: Höhe der Pyramide<br>• <b>${HS}</b> = ${len('ES')}: Höhe der Seitenfläche ABS (Seitenflächenhöhe)<br>• <b>s</b> = ${len('BS')}: Seitenkante`}));

    {type:'mc',q:`In welchem rechtwinkligen Dreieck kommen h und ${HS} vor?`,options:['Im Dreieck MES mit dem rechten Winkel bei M','Im Dreieck BES mit dem rechten Winkel bei S','Im Dreieck ABS mit dem rechten Winkel bei A'],correct:0,explain:`Die Höhe h steht senkrecht auf der Grundfläche. ${HS} ist die Hypotenuse.`,hint:'Die Höhe steht senkrecht auf der Grundfläche – im Punkt M.'},
    {type:'num',q:`Wie lang ist ${len('ME')}?`,unit:'cm',answer:3,tol:.001,hint:`${len('ME')} ist die halbe Grundkante: 6 cm : 2.`},
    {type:'num',q:`Berechne ${HS}: ${HS}² = 4² + 3².`,unit:'cm',answer:5,tol:.001,hint:`${HS}² = 16 + 9 = 25, dann die Wurzel ziehen.`},
    {type:'mc',q:'Für die Seitenkante s nutzt du das Dreieck BES. Wo liegt der rechte Winkel?',options:['Bei E – die Höhe der Seitenfläche steht senkrecht auf '+ov('AB'),'Bei C','Bei S'],correct:0,explain:`Im gleichschenkligen Dreieck ABS halbiert ${HS} die Basis ${ov('AB')} senkrecht.`,hint:'Die Seitenfläche ABS ist ein gleichschenkliges Dreieck mit der Höhe '+HS+'.'},
    {type:'num',q:`Berechne s: s² = ${HS}² + ${len('BE')}² = 5² + 3² (zwei Nachkommastellen).`,unit:'cm',answer:5.83,tol:.0051,hint:'s² = 25 + 9 = 34, dann s = √34.'}
   ],done);
 }},
 {title:'Pyramide mit rechteckiger Grundfläche',render(body,done){

    {type:'mc',q:`Im Stützdreieck MES ist ${len('ME')} eine Kathete. Wie lang ist ${len('ME')}?`,options:['3 cm (halbe Breite b)','4 cm (halbe Länge a)','5 cm','6 cm'],correct:0,explain:`${ov('ME')} verläuft parallel zu ${ov('BC')} vom Mittelpunkt M zur Seite ${ov('AB')}: ${len('ME')} = ${fr('b','2')}.`,hint:`Von M bis zur Seite ${ov('AB')} ist es so weit wie die halbe Seite ${ov('BC')}.`},

7:{title:'Koordinatensystem: Strecken, Betrag, Rechtwinkligkeit',komp:'Die Länge von Strecken im Koordinatensystem als Betrag eines Vektors berechnen, Dreiecke auf Rechtwinkligkeit und Gleichschenkligkeit prüfen und besondere Vierecke nachweisen.',
 steps:[
 {title:'Experiment: Strecken im Koordinatensystem',render:koordExperiment},
 {title:'Vom Vektor zur Länge',render(body,done){
   videoBlock(body,'s7','<b>Optional:</b> Schau dir ein Erklärvideo zur Länge einer Strecke im Koordinatensystem (Betrag eines Vektors) an.');
   body.append(h('div',{class:'info',html:`Erinnerung an die 8. Klasse: Der Vektor ${vec('PQ')} führt von P nach Q. Seine Koordinaten berechnest du mit „Spitze minus Fuß“: ${vec('PQ')} = ${cvec('x<sub>Q</sub> − x<sub>P</sub>','y<sub>Q</sub> − y<sub>P</sub>')}. Im Experiment waren das die gestrichelten Katheten.`}));
   body.append(h('div',{html:s7fig([['P',[1,2]],['Q',[5,5]]],{segs:[{a:[1,2],b:[5,2],col:'#16a34a',dash:true},{a:[5,2],b:[5,5],col:'#ea580c',dash:true},{a:[1,2],b:[5,5],col:'#2563eb',arrow:true}],rights:[{V:[5,2],p1:[1,2],p2:[5,5]}]})}));
   guided(body,[
    {type:'mc',q:`Gegeben sind ${ptS('P',1,2)} und ${ptS('Q',5,5)}. Welche Koordinaten hat ${vec('PQ')}?`,options:[cvec(4,3),cvec('−4','−3'),cvec(6,7),cvec(3,4)],correct:0,explain:`${vec('PQ')} = ${cvec('5 − 1','5 − 2')} = ${cvec(4,3)}`,hint:'Spitze (Q) minus Fuß (P), getrennt für x und y.'},
    {type:'num',q:`Die Koordinaten 4 und 3 sind die Katheten eines rechtwinkligen Dreiecks. Berechne ${len('PQ')}² = 4² + 3².`,unit:'LE²',answer:25,tol:.001,hint:'16 + 9'},
    {type:'num',q:`Wie lang ist die Strecke ${ov('PQ')}?`,unit:'LE',answer:5,tol:.001,hint:'√25'},
    {type:'mc',html:`<div class="info">Die Länge eines Vektors heißt <b>Betrag</b>: |${vec('PQ')}| = ${sq('4² + 3²')} = 5. Die Strecke ${ov('PQ')} ist genauso lang wie der Vektor: ${len('PQ')} = |${vec('PQ')}|.</div>`,q:`Jetzt mit negativen Koordinaten: ${ptS('A',-2,3)} und ${ptS('B',4,-5)}. Welche Koordinaten hat ${vec('AB')}?`,options:[cvec(6,'−8'),cvec(2,'−2'),cvec('−6',8),cvec(6,8)],correct:0,explain:`${vec('AB')} = ${cvec('4 − (−2)','−5 − 3')} = ${cvec(6,'−8')}`,hint:'4 − (−2) = 4 + 2. Und −5 − 3 = ?'},
    {type:'num',q:`Berechne ${len('AB')} = ${sq('6² + (−8)²')}.`,unit:'LE',answer:10,tol:.001,hint:'(−8)² = 64, also 36 + 64 = 100.'},
    {type:'mc',q:`Warum spielt das negative Vorzeichen bei −8 für die Länge keine Rolle?`,options:['Beim Quadrieren wird das Ergebnis nie negativ: (−8)² = 64.','Weil man das Minuszeichen einfach weglassen darf, ohne zu rechnen.','Es spielt eine Rolle: Die Strecke ist dann kürzer.'],correct:0,explain:'Minus mal Minus ergibt Plus. Längen sind nie negativ.',hint:'Rechne (−8) · (−8).'},
    {type:'mc',q:`Wie lang ist die Strecke, wenn man umgekehrt von B nach A geht, also |${vec('BA')}|?`,options:['Genauso lang: 10 LE',`Länge −10 LE`,'Doppelt so lang: 20 LE'],correct:0,explain:`${vec('BA')} = ${cvec('−6',8)} zeigt in die Gegenrichtung, ist aber genauso lang.`,hint:'Der Vektor zeigt in die andere Richtung. Ändert sich dadurch seine Länge?'}
   ],done);
 }},
 {title:'Rechtwinklige Dreiecke im Koordinatensystem',render(body,done){
   const T={A:[-2,3],B:[2,1],C:[5,7]};
   body.append(h('p',{html:`Das Dreieck ABC hat die Eckpunkte ${ptS('A',-2,3)}, ${ptS('B',2,1)} und ${ptS('C',5,7)}. Ist es rechtwinklig? Nach Augenmaß kann man das nicht sicher entscheiden – rechne mit der Umkehrung des Satzes des Pythagoras (Station 3).`}));
   body.append(h('div',{html:triFig(T)}));
   guided(body,[
    {type:'num',q:`${vec('AB')} = ${cvec(4,'−2')}. Berechne ${len('AB')}².`,unit:'LE²',answer:20,tol:.001,hint:'4² + (−2)² = 16 + 4'},
    {type:'num',q:`${vec('BC')} = ${cvec(3,6)}. Berechne ${len('BC')}².`,unit:'LE²',answer:45,tol:.001,hint:'3² + 6² = 9 + 36'},
    {type:'num',q:`Stelle ${vec('AC')} selbst auf und berechne ${len('AC')}².`,unit:'LE²',answer:65,tol:.001,hint:`${vec('AC')} = ${cvec('5 − (−2)','7 − 3')} = ${cvec(7,4)}`},
    {type:'mc',q:'Vergleiche: 20 + 45 = 65. Was folgt daraus?',options:['Das Dreieck ist rechtwinklig, der rechte Winkel liegt bei B.','Das Dreieck ist rechtwinklig, der rechte Winkel liegt bei C.','Das Dreieck ist rechtwinklig, der rechte Winkel liegt bei A.','Das Dreieck ist nicht rechtwinklig.'],correct:0,explain:`${ov('AC')} ist die längste Seite. Der rechte Winkel liegt ihr gegenüber, also bei B.`,hint:'Der rechte Winkel liegt der längsten Seite gegenüber.'},
    {type:'mc',q:`Ein anderes Dreieck PQR hat ${len('PQ')}² = 10, ${len('QR')}² = 20 und ${len('PR')}² = 40. Ist es rechtwinklig?`,options:['Nein, denn 10 + 20 = 30 ≠ 40.','Ja, denn 10 + 20 + 40 = 70.','Ja, der rechte Winkel liegt bei Q.'],correct:0,explain:'Die beiden kleineren Quadrate ergeben zusammen nicht das größte.',hint:'Addiere die beiden kleineren Werte und vergleiche mit dem größten.'}
   ],done);
 }},

 {n:'leicht',q:`Eine 5,0 m lange Leiter lehnt an einer senkrechten Hauswand. Ihr Fuß steht 1,4 m von der Wand entfernt. In welcher Höhe berührt die Leiter die Wand?`,
  tip:`Skizze: Wand und Boden bilden den rechten Winkel, die Leiter ist die Hypotenuse.`,
  sol:`<div>h² = (5,0 m)² − (1,4 m)² = 25 m² − 1,96 m² = 23,04 m²</div><div><b>h = 4,8 m</b></div><div>Die Leiter berührt die Wand in 4,8 m Höhe.</div>`},
 {n:'standard',q:`Im Dreieck ABC ist β = 90°, a = 0,48 m und c = 14 cm. Berechne die Länge der dritten Seite.`,
  tip:`Bei β = 90° liegt die Hypotenuse gegenüber von B – das ist b. Rechne zuerst alle Längen in cm um.`,
  sol:`<div>Hypotenuse ist b; a = 0,48 m = 48 cm</div><div>b² = (48 cm)² + (14 cm)² = 2304 cm² + 196 cm² = 2500 cm²</div><div><b>b = 50 cm</b></div>`},
 {n:'standard',q:`Ein Schrank ist 2,20 m hoch und 55 cm tief. Er liegt auf dem Rücken und soll im Zimmer aufgerichtet werden. Das Zimmer ist 2,30 m hoch. Kann der Schrank aufgestellt werden, ohne ihn auseinanderzubauen?`,
  tip:`Beim Aufrichten dreht sich der Schrank um eine untere Kante. Entscheidend ist die Diagonale der Seitenwand.`,
  sol:`<div>d² = (220 cm)² + (55 cm)² = 48 400 cm² + 3025 cm² = 51 425 cm²</div><div>d ≈ 226,8 cm</div><div>226,8 cm &lt; 230 cm ⇒ <b>Der Schrank kann aufgestellt werden</b> (es bleiben nur etwa 3 cm Platz).</div>`},
 {n:'plus',q:`Ein Fernseher im Format 16 : 9 hat eine Bildschirmdiagonale von 140 cm. Berechne die Breite und die Höhe des Bildschirms (eine Nachkommastelle).`,
  tip:`Setze Breite = 16k und Höhe = 9k. Dann gilt (16k)² + (9k)² = (140 cm)².`,
  sol:`<div>(16k)² + (9k)² = (140 cm)²</div><div>256k² + 81k² = 19 600 cm² ⇒ 337k² = 19 600 cm²</div><div>k² ≈ 58,16 cm² ⇒ k ≈ 7,626 cm</div><div>Breite = 16k ≈ <b>122,0 cm</b>; Höhe = 9k ≈ <b>68,6 cm</b></div>`}
],
3:[
 {n:'leicht',q:`Ein Dreieck hat die Seitenlängen 7 cm, 24 cm und 25 cm. Ist es rechtwinklig?`,
  tip:`Die längste Seite ist 25 cm. Vergleiche 7² + 24² mit 25².`,
  sol:`<div>(7 cm)² + (24 cm)² = 49 cm² + 576 cm² = 625 cm²</div><div>(25 cm)² = 625 cm²</div><div><b>Gleich ⇒ das Dreieck ist rechtwinklig</b>; der rechte Winkel liegt gegenüber der 25 cm langen Seite.</div>`},
 {n:'leicht',q:`Ein Dreieck hat die Seitenlängen 6 cm, 9 cm und 11 cm. Ist es rechtwinklig, spitzwinklig oder stumpfwinklig?`,
  tip:`Vergleiche die Summe der Quadrate der beiden kürzeren Seiten mit dem Quadrat der längsten Seite.`,
  sol:`<div>(6 cm)² + (9 cm)² = 36 cm² + 81 cm² = 117 cm²</div><div>(11 cm)² = 121 cm²</div><div>117 cm² &lt; 121 cm² ⇒ <b>nicht rechtwinklig, sondern stumpfwinklig</b></div>`},
 {n:'standard',q:`Prüfe, ob das Dreieck mit den Seitenlängen 2,4 dm; 70 mm und 25 cm rechtwinklig ist.`,
  tip:`Rechne zuerst alle Längen in dieselbe Einheit um, z. B. in cm.`,
  sol:`<div>2,4 dm = 24 cm; 70 mm = 7 cm</div><div>(7 cm)² + (24 cm)² = 49 cm² + 576 cm² = 625 cm² = (25 cm)²</div><div><b>Das Dreieck ist rechtwinklig.</b></div>`},
 {n:'standard',q:`Ein Seil ist durch Knoten in 30 gleich lange Abschnitte geteilt. Es soll so zu einem Dreieck gespannt werden, dass ein rechter Winkel entsteht. Wie viele Abschnitte muss jede Seite haben?`,
  tip:`Gesucht ist ein pythagoräisches Zahlentripel mit der Summe 30. Probiere bekannte Tripel aus.`,
  sol:`<div>(3; 4; 5): Summe 12 – Vielfache haben die Summe 24, 36, … – passt nicht.</div><div>(5; 12; 13): 5 + 12 + 13 = 30 ✓; 5² + 12² = 25 + 144 = 169 = 13²</div><div><b>5, 12 und 13 Abschnitte</b></div>`},
 {n:'plus',q:`Ein Dreieck hat die Seitenlängen x cm, (x + 7) cm und (x + 8) cm. Für welchen Wert von x ist es rechtwinklig?`,
  tip:`Die längste Seite ist (x + 8) cm. Stelle die Gleichung x² + (x + 7)² = (x + 8)² auf und löse sie.`,
  sol:`<div>x² + (x + 7)² = (x + 8)²</div><div>x² + x² + 14x + 49 = x² + 16x + 64</div><div>x² − 2x − 15 = 0 ⇒ (x − 5)(x + 3) = 0</div><div>x = 5 (x = −3 entfällt, da Längen positiv sind)</div><div><b>x = 5</b>: Seiten 5 cm, 12 cm, 13 cm</div>`}
],
4:[
 {n:'leicht',q:`Ein Rechteck ist 24 cm lang und 7 cm breit. Berechne die Länge der Diagonale.`,
  tip:`Die Diagonale ist die Hypotenuse eines rechtwinkligen Dreiecks mit Länge und Breite als Katheten.`,
  sol:`<div>d² = (24 cm)² + (7 cm)² = 576 cm² + 49 cm² = 625 cm²</div><div><b>d = 25 cm</b></div>`},
 {n:'leicht',q:`Eine Raute hat die Diagonalen e = 18 cm und f = 24 cm. Berechne die Seitenlänge, den Umfang und den Flächeninhalt.`,
  tip:`Die halben Diagonalen sind die Katheten. Flächeninhalt der Raute: A = ½ · e · f.`,
  sol:`<div>a² = (9 cm)² + (12 cm)² = 81 cm² + 144 cm² = 225 cm² ⇒ <b>a = 15 cm</b></div><div>u = 4 · 15 cm = <b>60 cm</b></div><div>A = ${HALF} · 18 cm · 24 cm = <b>216 cm²</b></div>`},
 {n:'standard',q:`Berechne die Höhe und den Flächeninhalt eines gleichseitigen Dreiecks mit der Seitenlänge 10 cm (zwei Nachkommastellen).`,
  tip:`Die Höhe halbiert die Grundseite: h² = (10 cm)² − (5 cm)². Oder: h = ${fr('a','2')} · √3.`,
  sol:`<div>h² = (10 cm)² − (5 cm)² = 75 cm² ⇒ h = 5 · √3 cm ≈ <b>8,66 cm</b></div><div>A = ${HALF} · 10 cm · 5√3 cm = 25 · √3 cm² ≈ <b>43,30 cm²</b></div>`},
 {n:'standard',q:`Ein gleichschenkliges Trapez hat die parallelen Seiten 30 cm und 14 cm. Die Schenkel sind 17 cm lang. Berechne die Höhe und den Flächeninhalt.`,
  tip:`Zeichne die Höhen ein. An jeder Seite entsteht ein rechtwinkliges Dreieck mit der waagrechten Kathete (30 cm − 14 cm) : 2.`,
  sol:`<div>Waagrechte Kathete: (30 cm − 14 cm) : 2 = 8 cm</div><div>h² = (17 cm)² − (8 cm)² = 289 cm² − 64 cm² = 225 cm² ⇒ <b>h = 15 cm</b></div><div>A = ${HALF} · (30 cm + 14 cm) · 15 cm = <b>330 cm²</b></div>`},
 {n:'plus',q:`Im Drachenviereck ABCD mit der Symmetrieachse AC ist ${len('AB')} = 10 cm, ${len('BC')} = 17 cm und die Diagonale ${len('BD')} = 16 cm. Berechne die Länge der Diagonale ${ov('AC')}, den Flächeninhalt und den Umfang.`,
  tip:`E ist der Schnittpunkt der Diagonalen. ${ov('AC')} halbiert ${ov('BD')} senkrecht: ${len('BE')} = 8 cm. Berechne ${len('AE')} und ${len('EC')} getrennt.`,
  sol:`<div>${len('AE')}² = (10 cm)² − (8 cm)² = 36 cm² ⇒ ${len('AE')} = 6 cm</div><div>${len('EC')}² = (17 cm)² − (8 cm)² = 225 cm² ⇒ ${len('EC')} = 15 cm</div><div>${len('AC')} = 6 cm + 15 cm = <b>21 cm</b></div><div>A = ${HALF} · 21 cm · 16 cm = <b>168 cm²</b>; u = 2 · (10 cm + 17 cm) = <b>54 cm</b></div>`},
 {n:'plus',q:`Ein regelmäßiges Sechseck hat die Seitenlänge 4 cm. Berechne seinen Flächeninhalt (zwei Nachkommastellen).`,
  tip:`Verbinde den Mittelpunkt mit allen Ecken: Es entstehen sechs gleichseitige Dreiecke mit der Seitenlänge 4 cm.`,
  sol:`<div>Höhe eines Teildreiecks: h² = (4 cm)² − (2 cm)² = 12 cm² ⇒ h = 2√3 cm ≈ 3,46 cm</div><div>A<sub>Dreieck</sub> = ${HALF} · 4 cm · 2√3 cm = 4√3 cm²</div><div>A = 6 · 4√3 cm² = 24√3 cm² ≈ <b>41,57 cm²</b></div>`}
],
5:[
 {n:'leicht',q:`Im Quadrat ABCD mit der Seitenlänge 6 cm liegen Punkte P<sub>n</sub> auf ${ov('AB')} und Q<sub>n</sub> auf ${ov('BC')} mit ${len('AP<sub>n</sub>')} = ${len('BQ<sub>n</sub>')} = x cm.<br>a) Gib ${len('P<sub>n</sub>B')} in Abhängigkeit von x an. b) Welche Werte darf x annehmen? c) Berechne ${len('P<sub>1</sub>Q<sub>1</sub>')} für x = 2 (zwei Nachkommastellen).`,
  tip:`Das Dreieck P<sub>n</sub>BQ<sub>n</sub> hat bei B einen rechten Winkel.`,
  sol:`<div>a) ${len('P<sub>n</sub>B')} = (6 − x) cm</div><div>b) 0 &lt; x &lt; 6</div><div>c) ${len('P<sub>1</sub>Q<sub>1</sub>')}² = [(6 − 2)² + 2²] cm² = 20 cm² ⇒ ${len('P<sub>1</sub>Q<sub>1</sub>')} ≈ <b>4,47 cm</b></div>`},
 {n:'standard',q:`Für die Strecken aus Aufgabe 1 gilt ${len('P<sub>n</sub>Q<sub>n</sub>')}² = [(6 − x)² + x²] cm². Bestimme mit der quadratischen Ergänzung die kürzeste Strecke und den zugehörigen Wert für x.`,
  tip:`Multipliziere aus, klammere den Faktor vor x² aus und ergänze quadratisch.`,
  sol:`<div>(6 − x)² + x² = 2x² − 12x + 36</div><div>= 2(x² − 6x + 3² − 3²) + 36 = 2(x − 3)² + 18</div><div>Für <b>x = 3</b>: ${len('P<sub>0</sub>Q<sub>0</sub>')} = √18 cm ≈ <b>4,24 cm</b></div>`},
 {n:'standard',q:`Im Rechteck ABCD ist ${len('AB')} = 8 cm und ${len('BC')} = 5 cm. P<sub>n</sub> liegt auf ${ov('AB')} und Q<sub>n</sub> auf ${ov('BC')} mit ${len('AP<sub>n</sub>')} = ${len('BQ<sub>n</sub>')} = x cm. Gib die Werte für x an und berechne die kürzeste Strecke ${ov('P<sub>0</sub>Q<sub>0</sub>')}.`,
  tip:`Q<sub>n</sub> muss auf ${ov('BC')} liegen – das begrenzt x stärker als ${ov('AB')}.`,
  sol:`<div>0 &lt; x &lt; 5</div><div>${len('P<sub>n</sub>Q<sub>n</sub>')}² = [(8 − x)² + x²] cm² = (2x² − 16x + 64) cm² = [2(x − 4)² + 32] cm²</div><div>x = 4 liegt im erlaubten Bereich ⇒ ${len('P<sub>0</sub>Q<sub>0</sub>')} = √32 cm ≈ <b>5,66 cm</b></div>`},
 {n:'standard',q:`Im Quadrat ABCD (Seitenlänge 8 cm) entstehen mit ${len('P<sub>n</sub>B')} = (8 − x) cm und ${len('BQ<sub>n</sub>')} = x cm rechtwinklige Dreiecke P<sub>n</sub>BQ<sub>n</sub>. Für welchen Wert von x ist der Flächeninhalt am größten? Berechne A<sub>max</sub>.`,
  tip:`A(x) = ½ · (8 − x) · x. Bringe den Term in die Scheitelform.`,
  sol:`<div>A(x) = ${HALF} · (8 − x) · x cm² = (−0,5x² + 4x) cm²</div><div>= [−0,5(x² − 8x + 4² − 4²)] cm² = [−0,5(x − 4)² + 8] cm²</div><div>Für <b>x = 4</b>: <b>A<sub>max</sub> = 8 cm²</b></div>`},
 {n:'plus',q:`Ein rechtwinkliges Dreieck ABC hat die Kathetenlängen ${len('AB')} = 6 cm und ${len('AC')} = 8 cm. Die kürzere Kathete wird um x cm verlängert, die längere gleichzeitig um x cm verkürzt. So entstehen Dreiecke AB<sub>n</sub>C<sub>n</sub>.<br>a) Stelle ${len('B<sub>n</sub>C<sub>n</sub>')} in Abhängigkeit von x dar. b) Für welchen Wert von x ist die Hypotenuse am kürzesten?`,
  tip:`Die neuen Katheten sind (6 + x) cm und (8 − x) cm.`,
  sol:`<div>a) ${len('B<sub>n</sub>C<sub>n</sub>')}² = [(6 + x)² + (8 − x)²] cm² = (2x² − 4x + 100) cm²</div><div>${len('B<sub>n</sub>C<sub>n</sub>')} = ${sq('2x² − 4x + 100')} cm; 0 ≤ x &lt; 8</div><div>b) 2x² − 4x + 100 = 2(x − 1)² + 98</div><div>Für <b>x = 1</b>: ${len('B<sub>0</sub>C<sub>0</sub>')} = √98 cm ≈ <b>9,90 cm</b></div>`}
],

 {n:'leicht',q:`Ein Quader hat die Kantenlängen a = 12 cm, b = 4 cm und c = 3 cm. Berechne die Flächendiagonale e der Grundfläche und die Raumdiagonale d.`,
  tip:`Erst e² = a² + b², dann d² = e² + c².`,
  sol:`<div>e² = (12 cm)² + (4 cm)² = 160 cm² ⇒ e ≈ <b>12,65 cm</b></div><div>d² = 160 cm² + (3 cm)² = 169 cm² ⇒ <b>d = 13 cm</b></div>`},
 {n:'leicht',q:`Ein Würfel hat die Kantenlänge 8 cm. Berechne die Länge einer Flächendiagonale und die Länge der Raumdiagonale.`,
  tip:`Würfel: e = a · √2 und d = a · √3.`,
  sol:`<div>e = 8 · √2 cm ≈ <b>11,31 cm</b></div><div>d = 8 · √3 cm ≈ <b>13,86 cm</b></div>`},
 {n:'standard',q:`Eine Sporthalle ist 27 m lang, 15 m breit und 7 m hoch. Ein WLAN-Router hängt in einer oberen Ecke. Sein Signal reicht 30 m weit. Erreicht es jede Stelle der Halle?`,
  tip:`Die am weitesten entfernte Stelle ist die gegenüberliegende untere Ecke. Berechne die Raumdiagonale.`,
  sol:`<div>d² = (27 m)² + (15 m)² + (7 m)² = 729 m² + 225 m² + 49 m² = 1003 m²</div><div>d ≈ 31,67 m &gt; 30 m ⇒ <b>Nein</b>, die gegenüberliegende Ecke wird nicht erreicht.</div>`},
 {n:'standard',q:`Eine gerade quadratische Pyramide hat die Grundkante a = 10 cm und die Höhe h = 12 cm. Berechne die Seitenflächenhöhe h<sub>a</sub>, die Seitenkante s (zwei Nachkommastellen) und den Oberflächeninhalt.`,
  tip:`Stützdreieck MES: h<sub>a</sub>² = h² + (a/2)². Stützdreieck BES: s² = h<sub>a</sub>² + (a/2)².`,
  sol:`<div>h<sub>a</sub>² = (12 cm)² + (5 cm)² = 169 cm² ⇒ <b>h<sub>a</sub> = 13 cm</b></div><div>s² = (13 cm)² + (5 cm)² = 194 cm² ⇒ s ≈ <b>13,93 cm</b></div><div>O = (10 cm)² + 4 · ${HALF} · 10 cm · 13 cm = 100 cm² + 260 cm² = <b>360 cm²</b></div>`},
 {n:'standard',q:`Eine gerade Pyramide hat eine rechteckige Grundfläche mit a = 12 cm und b = 8 cm. Ihre Höhe ist 9 cm. Berechne h<sub>a</sub>, h<sub>b</sub> und die Seitenkante s (zwei Nachkommastellen).`,
  tip:`h<sub>a</sub>² = h² + (b/2)²; h<sub>b</sub>² = h² + (a/2)²; s² = h² + |AM|² mit |AM| = ½ · |AC|.`,
  sol:`<div>h<sub>a</sub>² = (9 cm)² + (4 cm)² = 97 cm² ⇒ h<sub>a</sub> ≈ <b>9,85 cm</b></div><div>h<sub>b</sub>² = (9 cm)² + (6 cm)² = 117 cm² ⇒ h<sub>b</sub> ≈ <b>10,82 cm</b></div><div>${len('AC')}² = (12 cm)² + (8 cm)² = 208 cm² ⇒ ${len('AM')}² = 208 cm² : 4 = 52 cm²</div><div>s² = 81 cm² + 52 cm² = 133 cm² ⇒ s ≈ <b>11,53 cm</b></div>`},
 {n:'plus',q:`Ein Festzelt hat eine quadratische Grundfläche mit 6 m Seitenlänge. Die senkrechten Wände sind 2 m hoch, das Zelt ist insgesamt 4,5 m hoch. Das Dach ist eine Pyramide. Ihre vier Dachkanten und die Mittellinien der vier Dachflächen (vom Rand zur Spitze) bestehen aus Stahlrohren. Wie viele Meter Stahlrohr werden für das Dach benötigt?`,
  tip:`Höhe der Dachpyramide: 4,5 m − 2 m. Die Mittellinien sind die Seitenflächenhöhen h<sub>a</sub>, die Dachkanten die Seitenkanten s.`,
  sol:`<div>Dachhöhe h = 4,5 m − 2 m = 2,5 m; halbe Grundkante 3 m</div><div>h<sub>a</sub>² = (2,5 m)² + (3 m)² = 15,25 m² ⇒ h<sub>a</sub> ≈ 3,905 m</div><div>s² = 15,25 m² + (3 m)² = 24,25 m² ⇒ s ≈ 4,924 m</div><div>Rohrlänge = 4 · 3,905 m + 4 · 4,924 m ≈ <b>35,3 m</b></div>`}
],

 {n:'leicht',q:`Berechne den Betrag des Vektors ${vec('v')} = ${cvec(5,'−12')}.`,
  tip:`|${vec('v')}| = ${sq('v<sub>x</sub>² + v<sub>y</sub>²')}`,
  sol:`<div>|${vec('v')}| = ${sq('5² + (−12)²')} LE = √169 LE = <b>13 LE</b></div>`},
 {n:'leicht',q:`Berechne die Länge der Strecke ${ov('AB')} mit ${ptS('A',-3,1)} und ${ptS('B',5,7)}.`,
  tip:`Stelle zuerst ${vec('AB')} auf („Spitze minus Fuß“).`,
  sol:`<div>${vec('AB')} = ${cvec('5 − (−3)','7 − 1')} = ${cvec(8,6)}</div><div>${len('AB')} = ${sq('8² + 6²')} LE = √100 LE = <b>10 LE</b></div>`},
 {n:'standard',q:`Zeige durch Rechnung, dass das Dreieck ABC mit ${ptS('A',-2,-1)}, ${ptS('B',4,1)} und ${ptS('C',2,7)} gleichschenklig und rechtwinklig ist. Wo liegt der rechte Winkel?`,
  tip:`Berechne die Quadrate aller drei Seitenlängen.`,
  sol:`<div>${len('AB')}² = (6² + 2²) LE² = 40 LE²</div><div>${len('BC')}² = [(−2)² + 6²] LE² = 40 LE²</div><div>${len('AC')}² = (4² + 8²) LE² = 80 LE²</div><div>${len('AB')} = ${len('BC')} ⇒ gleichschenklig; 40 + 40 = 80 ⇒ rechtwinklig</div><div><b>Der rechte Winkel liegt bei B</b> (gegenüber der längsten Seite ${ov('AC')}).</div>`},
 {n:'standard',q:`Zeige, dass das Viereck ABCD mit ${ptS('A',-2,-1)}, ${ptS('B',2,2)}, ${ptS('C',2,7)} und ${ptS('D',-2,4)} eine Raute, aber kein Quadrat ist. Berechne den Flächeninhalt.`,
  tip:`Raute: vier gleich lange Seiten. Quadrat: zusätzlich gleich lange Diagonalen. Flächeninhalt: A = ½ · e · f.`,
  sol:`<div>${len('AB')}² = (4² + 3²) LE² = 25 LE²; ${len('BC')}² = 5² LE² = 25 LE²; ${len('CD')}² = [(−4)² + (−3)²] LE² = 25 LE²; ${len('DA')}² = (−5)² LE² = 25 LE²</div><div>Alle Seiten 5 LE ⇒ Raute</div><div>${len('AC')}² = (4² + 8²) LE² = 80 LE²; ${len('BD')}² = [(−4)² + 2²] LE² = 20 LE² ⇒ Diagonalen verschieden ⇒ <b>kein Quadrat</b></div><div>A = ${HALF} · √80 LE · √20 LE = ${HALF} · 40 FE = <b>20 FE</b></div>`},
 {n:'plus',q:`Der Punkt P liegt auf der y-Achse und ist von ${ptS('A',-4,2)} und ${ptS('B',2,6)} gleich weit entfernt. Berechne die Koordinaten von P.`,
  tip:`P(0 | y). Setze ${len('AP')}² = ${len('BP')}² – die y²-Terme fallen weg.`,
  sol:`<div>${len('AP')}² = 4² + (y − 2)² = y² − 4y + 20</div><div>${len('BP')}² = (−2)² + (y − 6)² = y² − 12y + 40</div><div>y² − 4y + 20 = y² − 12y + 40 ⇒ 8y = 20 ⇒ y = 2,5</div><div><b>P(0 | 2,5)</b></div>`},
 {n:'plus',q:`Von einem Sitzplatz ${ptS('P',1,2)} aus sieht man eine Bühne ${ov('AB')} mit ${ptS('A',-1,6)} und ${ptS('B',5,4)}. Zeige, dass man die Bühne unter einem Winkel von 90° sieht.`,
  tip:`Untersuche das Dreieck ABP mit der Umkehrung des Satzes des Pythagoras.`,
  sol:`<div>${len('PA')}² = [(−2)² + 4²] LE² = 20 LE²; ${len('PB')}² = (4² + 2²) LE² = 20 LE²</div><div>${len('AB')}² = [6² + (−2)²] LE² = 40 LE²</div><div>20 + 20 = 40 ⇒ <b>Das Dreieck ABP ist bei P rechtwinklig</b>; man sieht die Bühne unter 90°.</div>`}
],

 {n:'leicht',q:`Die Punkte P<sub>n</sub>(x | 0,5x + 2) liegen auf der Geraden g. Gegeben ist ${ptS('Q',4,0)}. Stelle ${vec('QP<sub>n</sub>')}(x) auf und berechne ${len('QP<sub>1</sub>')} für x = 2 (zwei Nachkommastellen).`,
  tip:`„Spitze minus Fuß“: ${vec('QP<sub>n</sub>')} = ${cvec('x − 4','0,5x + 2 − 0')}.`,
