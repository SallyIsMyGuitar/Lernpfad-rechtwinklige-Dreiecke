<style>
:root{--ink:#1f2937;--mut:#6b7280;--bg:#f4f6fb;--card:#fff;--line:#e5e7eb;--blue:#2563eb;--green:#16a34a;--orange:#ea580c;--red:#dc2626;--merk:#fff7d6;--merkline:#e0b400}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;font-size:17px}
header.top{background:#1e3a8a;color:#fff;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header.top h1{font-size:18px;margin:0;flex:1;min-width:200px}
header.top button{background:#fff;color:#1e3a8a;border:0;border-radius:8px;padding:8px 12px;font-size:15px;font-weight:600;cursor:pointer}
main{max-width:860px;margin:0 auto;padding:16px}
h2{margin:8px 0 4px}h3{margin:0 0 8px;font-size:18px}
.card,.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.step.done{border-left:6px solid var(--green)}
.step h3::before{content:"";}
.step.done h3::after{content:" ✓";color:var(--green)}

.vec{display:inline-block;position:relative;line-height:1.1;padding-top:.34em}.vec::before{content:"";position:absolute;left:1px;right:3px;top:.14em;border-top:1.3px solid currentColor}.vec::after{content:"";position:absolute;right:0;top:-.03em;border-left:.4em solid currentColor;border-top:.17em solid transparent;border-bottom:.17em solid transparent}
.cv{display:inline-flex;align-items:center;vertical-align:middle;white-space:nowrap}.cvp{font-size:2.1em;font-weight:200;line-height:1;transform:scaleX(.65)}.cvi{display:inline-flex;flex-direction:column;align-items:center;line-height:1.2;font-size:.9em;padding:0 1px}

 body.printing header.top,body.printing main{display:none}

<script>
'use strict';
/* ====== Konfiguration ====== */
// Erklärvideos: videoId (YouTube) eintragen -> wird datenschutzfreundlich (youtube-nocookie) eingebettet.
// Ohne videoId erscheint ein Button mit YouTube-Suche zum Suchbegriff.
const VIDEOS={
  s1:{videoId:null,query:'Satz des Pythagoras Herleitung Erklärung Katheten Hypotenuse'},
  s2:{videoId:null,query:'Satz des Pythagoras Hypotenuse und Kathete berechnen'},
  s3:{videoId:null,query:'Umkehrung Satz des Pythagoras rechtwinklig nachweisen'},
  s4:{videoId:null,query:'Satz des Pythagoras gleichschenkliges Dreieck Raute Höhe'},
  s5:{videoId:null,query:'Extremwert quadratische Ergänzung Streckenlänge Satz des Pythagoras'},
  s6:{videoId:null,query:'Raumdiagonale Quader Pyramide Satz des Pythagoras'},
  s7:{videoId:null,query:'Länge einer Strecke Koordinatensystem Betrag Vektor Pythagoras'},
  s8:{videoId:null,query:'Streckenlänge in Abhängigkeit von x Gerade minimale Länge quadratische Ergänzung'}
};
const KEY='lernpfad-rechtwinklige-dreiecke-v1';
const TEACHER=new URLSearchParams(location.search).has('lehrer');

/* ====== Helfer ====== */
const app=document.getElementById('app');
function h(tag,attrs,...kids){const e=document.createElement(tag);for(const [k,v] of Object.entries(attrs||{})){if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v);}for(const c of kids.flat()){if(c==null)continue;e.append(c.nodeType?c:document.createTextNode(c));}return e;}
const rnd=(a,b)=>a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const fmt=(x,d=2)=>Number(x.toFixed(d)).toString().replace('.',',');
// akzeptiert z. B. „12,5“, „,5“, „12.5“, „5 cm“, „25 cm²“
const parseNum=s=>{const t=String(s).trim().replace(/\s*(mm|cm|dm|km|m)?\s*[²³]?$/i,'').replace(/\s+/g,'').replace(',','.');return /^-?(\d+(\.\d*)?|\.\d+)$/.test(t)?parseFloat(t):NaN;};
const once=fn=>{let d=false;return(...a)=>{if(d)return;d=true;return fn(...a);};};

// Notation nach Zeichenkatalog: Strecke AB̅, Länge |AB̅|, Quadratwurzel mit Wurzelstrich, Bruch
const ov=s=>`<span class="ov">${s}</span>`;
const len=s=>`|${ov(s)}|`;
const sq=s=>`√<span class="rad">${s}</span>`;
const fr=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const HALF=fr(1,2);
/* ====== Notation: Vektoren, Punkte, Terme ====== */
const vec=s=>`<span class="vec">${s}</span>`;
const cvec=(a,b)=>`<span class="cv"><span class="cvp">(</span><span class="cvi"><span>${a}</span><span>${b}</span></span><span class="cvp">)</span></span>`;
const nf=(v,d=2)=>fmt(v,d).replace('-','−');
const ptS=(n,x,y)=>`${n}(${nf(x)} | ${nf(y)})`;
const sqp=v=>v<0?`(${nf(v)})²`:`${nf(v)}²`;
// Term aus [Koeffizient, Variable]-Paaren, z. B. poly([1.25,'x²'],[-10,'x'],[40,'']) -> „1,25x² − 10x + 40“
function poly(...cs){let s='';for(const [k,v] of cs){if(Math.abs(k)<1e-9)continue;const ab=Math.abs(k),b=(Math.abs(ab-1)<1e-9&&v?'':nf(ab))+v;if(!s)s=(k<0?'−':'')+b;else s+=(k<0?' − ':' + ')+b;}return s||'0';}
const lin=(m,c)=>poly([m,'x'],[c,'']);
const uniqOpts=(arr,extra=[])=>{const out=[];for(const o of [...arr,...extra]){if(!out.includes(o))out.push(o);if(out.length>=4)break;}return out;};


let state={};
try{state=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){state={};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

/* ====== Merkkästen (Hefteinträge) ====== */
const MERK={
1:{title:'Der Satz des Pythagoras',html:`
<div class="mh">Der Satz des Pythagoras</div>
<p><b>Bezeichnungen im rechtwinkligen Dreieck:</b><br>
Die beiden Seiten am rechten Winkel heißen <b>Katheten</b> (a, b).<br>
Die Seite gegenüber dem rechten Winkel heißt <b>Hypotenuse</b> (c) – sie ist die längste Seite.</p>
<p><b>Satz des Pythagoras:</b> In jedem rechtwinkligen Dreieck ist die Summe der Flächeninhalte der Quadrate über den Katheten so groß wie der Flächeninhalt des Quadrats über der Hypotenuse.</p>
<div class="formel">a² + b² = c²</div>
<div class="ex"><b>Beispiel 1:</b> Dreieck PQR mit rechtem Winkel bei Q.<br>
Hypotenuse: ${ov('PR')} (liegt gegenüber von Q)<br>
Satz des Pythagoras: ${len('PQ')}² + ${len('QR')}² = ${len('PR')}²</div>
<div class="ex"><b>Beispiel 2:</b> Die Kathetenquadrate haben 9 cm² und 16 cm².<br>
Hypotenusenquadrat: 9 cm² + 16 cm² = 25 cm²</div>`},
2:{title:'Seitenlängen berechnen',html:`
<div class="mh">Seitenlängen im rechtwinkligen Dreieck berechnen</div>
<p>Immer zuerst: <b>Skizze</b> anfertigen, rechten Winkel markieren, Hypotenuse bestimmen. Die Hypotenuse liegt dem rechten Winkel gegenüber (bei α = 90° ist a die Hypotenuse). Vor dem Rechnen alle Längen in <b>dieselbe Einheit</b> umrechnen.</p>
<p><b>Hypotenuse gesucht:</b> &nbsp; c² = a² + b² &nbsp;⇒&nbsp; <b>c = ${sq('a² + b²')}</b></p>
<p><b>Kathete gesucht:</b> &nbsp; a² = c² − b² &nbsp;⇒&nbsp; <b>a = ${sq('c² − b²')}</b> &nbsp; (entsprechend b = ${sq('c² − a²')})</p>
<p>Ist das Ergebnis keine Quadratzahl: Taschenrechner benutzen und sinnvoll runden. Die Hypotenuse ist immer die längste Seite (Probe!).</p>
<div class="ex"><b>Beispiel 1 (Hypotenuse):</b> a = 6 cm; b = 8 cm<br>
c² = 6² + 8² = 36 + 64 = 100<br>
c = √100 = 10 cm</div>
<div class="ex"><b>Beispiel 2 (Kathete):</b> c = 13 cm; a = 5 cm<br>
b² = 13² − 5² = 169 − 25 = 144<br>
b = √144 = 12 cm</div>`},
3:{title:'Umkehrung des Satzes des Pythagoras',html:`
<div class="mh">Umkehrung des Satzes des Pythagoras</div>
<p><b>Umkehrung:</b> Gilt in einem Dreieck für die Seitenlängen a, b und c (c ist die längste Seite) die Gleichung</p>
<div class="formel">a² + b² = c²</div>
<p>so ist das Dreieck <b>rechtwinklig</b>. Der rechte Winkel liegt der längsten Seite c gegenüber.<br>
Gilt die Gleichung nicht, ist das Dreieck <b>nicht rechtwinklig</b>.</p>
<p><b>Nachweis in 4 Schritten:</b> 1. längste Seite c bestimmen · 2. a² + b² berechnen · 3. c² berechnen · 4. vergleichen und Antwortsatz schreiben.</p>
<div class="ex"><b>Beispiel 1:</b> a = 4,5 cm; b = 6 cm; c = 7,5 cm<br>
a² + b² = 20,25 + 36 = 56,25<br>
c² = 56,25 ⇒ a² + b² = c²<br>
Das Dreieck ist rechtwinklig.</div>
<div class="ex"><b>Beispiel 2:</b> a = 4 cm; b = 5 cm; c = 7 cm<br>
a² + b² = 16 + 25 = 41; c² = 49<br>
41 ≠ 49 ⇒ Das Dreieck ist nicht rechtwinklig.</div>`},
4:{title:'Satz des Pythagoras in ebenen Figuren',html:`
<div class="mh">Satz des Pythagoras in ebenen Figuren</div>
<p>Vorgehen: <b>Skizze</b> zeichnen · <b>rechtwinkliges Teildreieck</b> suchen (Höhe, Diagonale) · bekannte und gesuchte Seite bestimmen · Satz des Pythagoras anwenden · Antwortsatz.</p>
<p><b>Gleichschenkliges Dreieck:</b> Die Höhe auf die Basis halbiert die Basis.<br>
<b>Raute:</b> Die Diagonalen halbieren sich und stehen senkrecht aufeinander. Es gilt <span class="nw">a² = (${fr('e','2')})² + (${fr('f','2')})²</span>.</p>
<div class="ex"><b>Beispiel 1:</b> Gleichschenkliges Dreieck, Schenkel 10 cm, Basis 12 cm<br>
h² = 10² − 6² = 100 − 36 = 64 ⇒ h = 8 cm<br>
A = ${HALF} · 12 cm · 8 cm = 48 cm²</div>
<div class="ex"><b>Beispiel 2:</b> Raute mit e = 48 mm und f = 64 mm<br>
a² = 24² + 32² = 576 + 1024 = 1600 ⇒ a = 40 mm<br>
Umfang u = 4 · 40 mm = 160 mm</div>`},
5:{title:'Funktionale Abhängigkeiten und Extremwerte',html:`
<div class="mh">Funktionale Abhängigkeiten und Extremwerte</div>
<p>Wandern Punkte P<sub>n</sub>, Q<sub>n</sub>, … auf den Seiten einer Figur, hängen Streckenlängen und Flächeninhalte von x ab.</p>
<p><b>Vorgehen:</b><br>
1. Skizze: rechtwinkliges Teildreieck suchen, Katheten in Abhängigkeit von x angeben.<br>
2. Satz des Pythagoras: Term für ${len('P<sub>n</sub>Q<sub>n</sub>')}² aufstellen und vereinfachen.<br>
3. Werte für x angeben: Alle Strecken müssen länger als 0 cm sein und die Punkte auf ihren Seiten liegen.<br>
4. Quadratische Ergänzung: Term in die Form a(x − d)² + e bringen.<br>
5. Ablesen: a &gt; 0 ⇒ <b>kleinster</b> Wert e für x = d; a &lt; 0 ⇒ <b>größter</b> Wert e für x = d.<br>
6. Bei Streckenlängen die Wurzel ziehen: Ist der Radikand am kleinsten, ist auch die Wurzel am kleinsten. Antwortsatz.</p>
<div class="ex"><b>Beispiel:</b> Quadrat ABCD mit 8 cm Seitenlänge; ${len('AP<sub>n</sub>')} = ${len('BQ<sub>n</sub>')} = x cm<br>
${len('P<sub>n</sub>B')} = (8 − x) cm; 0 &lt; x &lt; 8<br>
${len('P<sub>n</sub>Q<sub>n</sub>')}² = (8 − x)² + x² = 2x² − 16x + 64<br>
= 2(x² − 8x + 4² − 4²) + 64 = 2(x − 4)² + 32<br>
Für x = 4 ist die Strecke am kürzesten: ${len('P<sub>n</sub>Q<sub>n</sub>')}<sub>min</sub> = √32 cm ≈ 5,66 cm</div>`},
6:{title:'Satz des Pythagoras in Körpern',html:`
<div class="mh">Satz des Pythagoras in Körpern</div>
<p>Vorgehen: rechtwinkliges Dreieck im Körper suchen (in einer Seitenfläche oder im Inneren) und als ebene Skizze herauszeichnen. Oft braucht man zwei Schritte.</p>
<p><b>Quader</b> (Länge a, Breite b, Höhe c):<br>
Flächendiagonale der Grundfläche: e² = a² + b²<br>
Raumdiagonale: d² = e² + c² &nbsp;⇒&nbsp; <b>d = ${sq('a² + b² + c²')}</b></p>
<p><b>Würfel</b> (Kantenlänge a): Flächendiagonale e = a · √2; Raumdiagonale <b>d = a · √3</b></p>
<p><b>Gerade quadratische Pyramide</b> (Grundkante a, Höhe h):<br>
Höhe der Seitenfläche: h<sub>s</sub>² = h² + (${fr('a','2')})²<br>
Seitenkante: s² = h<sub>s</sub>² + (${fr('a','2')})²</p>
<div class="ex"><b>Beispiel 1:</b> Quader mit a = 4 cm; b = 3 cm; c = 12 cm<br>
e² = 4² + 3² = 25 ⇒ e = 5 cm<br>
d² = 5² + 12² = 169 ⇒ d = 13 cm</div>
<div class="ex"><b>Beispiel 2:</b> Pyramide mit a = 6 cm; h = 4 cm<br>
h<sub>s</sub>² = 4² + 3² = 25 ⇒ h<sub>s</sub> = 5 cm<br>
s² = 5² + 3² = 34 ⇒ s ≈ 5,83 cm</div>`},
7:{title:'Strecken im Koordinatensystem',html:`
<div class="mh">Strecken im Koordinatensystem</div>
<p><b>Vektor</b> von P(x<sub>P</sub> | y<sub>P</sub>) nach Q(x<sub>Q</sub> | y<sub>Q</sub>) („Spitze minus Fuß“):</p>
<div class="formel">${vec('PQ')} = ${cvec('x<sub>Q</sub> − x<sub>P</sub>','y<sub>Q</sub> − y<sub>P</sub>')}</div>
<p>Die Koordinaten des Vektors sind die Katheten eines rechtwinkligen Dreiecks. Die Länge des Vektors heißt <b>Betrag</b>. Die Strecke ${ov('PQ')} ist so lang wie der Vektor:</p>
<div class="formel">${len('PQ')} = |${vec('PQ')}| = ${sq('(x<sub>Q</sub> − x<sub>P</sub>)² + (y<sub>Q</sub> − y<sub>P</sub>)²')}</div>
<p><b>Rechtwinkligkeit prüfen:</b> Die Quadrate aller drei Seitenlängen berechnen. Gilt für die beiden kleineren und das größte Quadrat a² + b² = c², ist das Dreieck rechtwinklig (Umkehrung des Satzes des Pythagoras). Der rechte Winkel liegt der längsten Seite gegenüber.</p>
<div class="ex"><b>Beispiel 1:</b> P(1 | 2); Q(5 | 5)<br>
${vec('PQ')} = ${cvec('5 − 1','5 − 2')} = ${cvec(4,3)}<br>
${len('PQ')} = ${sq('4² + 3²')} = √25 = 5 cm</div>
<div class="ex"><b>Beispiel 2:</b> A(−2 | 3); B(2 | 1); C(5 | 7)<br>
${len('AB')}² = 4² + (−2)² = 20; ${len('BC')}² = 3² + 6² = 45; ${len('AC')}² = 7² + 4² = 65<br>
20 + 45 = 65 ⇒ Das Dreieck ist rechtwinklig, der rechte Winkel liegt bei B.</div>`},
8:{title:'Streckenlänge in Abhängigkeit von x',html:`
<div class="mh">Streckenlänge in Abhängigkeit von x</div>
<p>Liegen Punkte P<sub>n</sub> auf einer Geraden g, z. B. y = 0,5x + 1, so gilt P<sub>n</sub>(x | 0,5x + 1). Die Länge der Strecken zu einem festen Punkt Q hängt von x ab.</p>
<p><b>Vorgehen:</b><br>
1. Vektor aufstellen: ${vec('QP<sub>n</sub>')}(x) = Spitze minus Fuß.<br>
2. Satz des Pythagoras: ${len('QP<sub>n</sub>')}² = (x-Koordinate)² + (y-Koordinate)², mit den binomischen Formeln vereinfachen.<br>
3. Quadratische Ergänzung: Term in die Form a(x − d)² + e bringen.<br>
4. Für x = d ist die Strecke am kürzesten: ${len('QP<sub>0</sub>')} = √e. Koordinaten von P<sub>0</sub> mit der Geradengleichung berechnen.<br>
Die kürzeste Strecke steht <b>senkrecht</b> auf der Geraden g.</p>
<div class="ex"><b>Beispiel:</b> g: y = 0,5x + 1; Q(6 | −1)<br>
${vec('QP<sub>n</sub>')}(x) = ${cvec('x − 6','0,5x + 1 − (−1)')} = ${cvec('x − 6','0,5x + 2')}<br>
${len('QP<sub>n</sub>')}² = (x − 6)² + (0,5x + 2)² = x² − 12x + 36 + 0,25x² + 2x + 4 = 1,25x² − 10x + 40<br>
= 1,25(x² − 8x + 4² − 4²) + 40 = 1,25(x − 4)² + 20<br>
Für x = 4 ist die Strecke am kürzesten: ${len('QP<sub>0</sub>')} = √20 cm ≈ 4,47 cm mit P<sub>0</sub>(4 | 3)</div>`}
};

/* ====== Zeichnen: Winkelbogen (Zeichenkatalog: rechter Winkel = Bogen mit Punkt) ====== */
// V Scheitel, u1/u2 Einheitsvektoren der Schenkel (SVG-Koordinaten), r Radius, dot: Punkt für rechten Winkel
function angMark(V,u1,u2,r,dot,sw,col='#111'){
  const P1=[V[0]+u1[0]*r,V[1]+u1[1]*r],P2=[V[0]+u2[0]*r,V[1]+u2[1]*r];
  const sweep=(u1[0]*u2[1]-u1[1]*u2[0])>0?1:0;
  let g=`<path d="M${P1[0]},${P1[1]} A${r},${r} 0 0 ${sweep} ${P2[0]},${P2[1]}" fill="none" stroke="${col}" stroke-width="${sw}"/>`;
  if(dot){const bx=u1[0]+u2[0],by=u1[1]+u2[1],bl=Math.hypot(bx,by)||1;g+=`<circle cx="${V[0]+bx/bl*r*.5}" cy="${V[1]+by/bl*r*.5}" r="${r*.11}" fill="${col}"/>`;}
  return g;
}

/* ====== Zeichnen: Dreieck mit Beschriftung ====== */
function triSvg(o){
  const L1=o.L1||4,L2=o.L2||3;
  let P=[[0,0],[L1,0],[0,L2]];
  if(o.mirror)P=P.map(([x,y])=>[-x,y]);
  const r=(o.rot||0)*Math.PI/180,c=Math.cos(r),s=Math.sin(r);
  P=P.map(([x,y])=>[x*c-y*s,-(x*s+y*c)]);
  const cen=[(P[0][0]+P[1][0]+P[2][0])/3,(P[0][1]+P[1][1]+P[2][1])/3];
  const away=(pt,d)=>{const dx=pt[0]-cen[0],dy=pt[1]-cen[1],l=Math.hypot(dx,dy)||1;return[pt[0]+dx/l*d,pt[1]+dy/l*d];};
  const S=[[0,1],[0,2],[1,2]];
  const xs=P.map(p=>p[0]),ys=P.map(p=>p[1]);
  let minx=Math.min(...xs)-2.8,maxx=Math.max(...xs)+2.8,miny=Math.min(...ys)-1.8,maxy=Math.max(...ys)+1.8;
  if(maxx-minx<11){const d=(11-(maxx-minx))/2;minx-=d;maxx+=d;}
  if(maxy-miny<7){const d=(7-(maxy-miny))/2;miny-=d;maxy+=d;}
  const u=(a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy);return[dx/l,dy/l];};
  const u1=u(P[0],P[1]),u2=u(P[0],P[2]);
  let g=`<polygon points="${P.map(p=>p.join(',')).join(' ')}" fill="#eef4ff" stroke="#1f2937" stroke-width=".08"/>`+angMark(P[0],u1,u2,.62,true,.06,'#1f2937');
  if(o.labels)S.forEach((sd,i)=>{if(o.labels[i]==null)return;const m=[(P[sd[0]][0]+P[sd[1]][0])/2,(P[sd[0]][1]+P[sd[1]][1])/2];const q=away(m,.7);g+=`<text x="${q[0]}" y="${q[1]}" font-size=".52" text-anchor="middle" dominant-baseline="middle" fill="#111">${o.labels[i]}</text>`;});
  if(o.vertex)P.forEach((p,i)=>{const q=away(p,.75);g+=`<text x="${q[0]}" y="${q[1]}" font-size=".66" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1e3a8a">${o.vertex[i]}</text>`;});
  if(o.clickable)S.forEach((sd,i)=>{g+=`<line class="hit" data-side="${i}" x1="${P[sd[0]][0]}" y1="${P[sd[0]][1]}" x2="${P[sd[1]][0]}" y2="${P[sd[1]][1]}"/>`;});
  return `<svg class="fig" style="width:${o.w||360}px" viewBox="${minx} ${miny} ${maxx-minx} ${maxy-miny}" xmlns="http://www.w3.org/2000/svg">${g}</svg>`;
}

/* ====== Zeichnen: Dreieck mit Quadraten (Experiment) ====== */
function squaresSvg(a,b,gdeg){
  const g=gdeg*Math.PI/180;
  const C=[0,0],B=[a,0],A=[b*Math.cos(g),b*Math.sin(g)];
  const sq=(Pp,Q,R)=>{const dx=Q[0]-Pp[0],dy=Q[1]-Pp[1];let nx=-dy,ny=dx;const mx=(Pp[0]+Q[0])/2,my=(Pp[1]+Q[1])/2;if((R[0]-mx)*nx+(R[1]-my)*ny>0){nx=-nx;ny=-ny;}return[Pp,Q,[Q[0]+nx,Q[1]+ny],[Pp[0]+nx,Pp[1]+ny]];};
  const fl=p=>[p[0],-p[1]];
  const sa=sq(C,B,A).map(fl),sb=sq(C,A,B).map(fl),sc=sq(B,A,C).map(fl);
  const tri=[C,B,A].map(fl);
  const all=[...sa,...sb,...sc,...tri];
  const xs=all.map(p=>p[0]),ys=all.map(p=>p[1]);
  const pad=1,minx=Math.min(...xs)-pad,maxx=Math.max(...xs)+pad,miny=Math.min(...ys)-pad,maxy=Math.max(...ys)+pad;
  const W=maxx-minx,H=maxy-miny,fs=Math.max(W,H)/26;
  const poly=(q,col)=>`<polygon points="${q.map(p=>p.join(',')).join(' ')}" fill="${col}" fill-opacity=".35" stroke="${col}" stroke-width="${fs/10}"/>`;
  const ctr=q=>[(q[0][0]+q[2][0])/2,(q[0][1]+q[2][1])/2];
  const lab=(q,t)=>{const c=ctr(q);return `<text x="${c[0]}" y="${c[1]}" font-size="${fs}" text-anchor="middle" dominant-baseline="middle" fill="#111" font-weight="600">${t}</text>`;};
  const c2=a*a+b*b-2*a*b*Math.cos(g);
  const f=x=>fmt(x,1);
  let svg=poly(sa,'#2563eb')+poly(sb,'#16a34a')+poly(sc,'#ea580c');
  svg+=`<polygon points="${tri.map(p=>p.join(',')).join(' ')}" fill="#fff" stroke="#111" stroke-width="${fs/9}"/>`;
  svg+=lab(sa,'a² = '+f(a*a))+lab(sb,'b² = '+f(b*b))+lab(sc,'c² = '+f(c2));
  svg+=angMark([0,0],[1,0],[Math.cos(g),-Math.sin(g)],Math.min(a,b)*.25,Math.abs(gdeg-90)<.01,fs/10);
  return {svg:`<svg class="fig" style="width:100%;max-width:520px" viewBox="${minx} ${miny} ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${svg}</svg>`,c2};
}

/* ====== Bausteine ====== */
function mc(body,o,onOk,onBad){
  const box=h('div',{class:'q'},h('p',{class:'qt',html:o.q}));
  const fb=h('div',{class:'fb','aria-live':'polite'}),list=h('div',{class:'opts'});
  const order=shuffle(o.options.map((_,i)=>i));
  order.forEach(i=>{
    const b=h('button',{class:'opt',type:'button',html:o.options[i]});
    b.addEventListener('click',()=>{
      if(b.disabled)return;
      if(i===o.correct){b.classList.add('ok');[...list.children].forEach(x=>x.disabled=true);fb.className='fb ok';fb.innerHTML='✓ Richtig. '+(o.explain||'');onOk&&onOk();}
      else{b.classList.add('bad');b.disabled=true;fb.className='fb bad';fb.innerHTML='Noch nicht. '+(o.hint||'Überlege noch einmal.');onBad&&onBad();}
    });
    list.append(b);
  });
  box.append(list,fb);body.append(box);return box;
}
function numQ(body,o,onOk,onBad){
  const tol=o.tol==null?0.0051:o.tol;
  const inp=h('input',{class:'num',type:'text',inputmode:'decimal',autocomplete:'off',placeholder:'Ergebnis'});
  const fb=h('div',{class:'fb','aria-live':'polite'});
  const btn=h('button',{class:'btn',type:'button'},'Prüfen');
  const check=()=>{
    if(inp.disabled)return;
    const v=parseNum(inp.value);
    if(isNaN(v)){fb.className='fb bad';fb.textContent='Bitte eine Zahl eingeben (z. B. 12,5).';return;}
    if(Math.abs(v-o.answer)<=tol){inp.disabled=true;btn.disabled=true;fb.className='fb ok';fb.innerHTML='✓ Richtig. '+(o.explain||'');onOk&&onOk();}
    else{fb.className='fb bad';let m=o.hint||'Noch nicht. Rechne noch einmal nach.';if(tol<0.01&&!Number.isInteger(o.answer)&&Math.abs(v-o.answer)<0.06)m='Fast! Runde auf zwei Nachkommastellen.';fb.innerHTML=m;onBad&&onBad();}
  };
  btn.addEventListener('click',check);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
  const box=h('div',{class:'q'},h('p',{class:'qt',html:o.q}),h('div',{},inp,' ',o.unit||'',' ',btn),fb);
  body.append(box);return box;
}
function nextBtn(body,label,fn){const b=h('button',{class:'btn',type:'button'},label);b.addEventListener('click',()=>{b.disabled=true;fn();});body.append(b);return b;}
function videoBlock(body,key,text){

  if(v.videoId){box.append(h('div',{html:`<iframe style="width:100%;aspect-ratio:16/9;border:0;border-radius:10px;margin-top:8px" src="https://www.youtube-nocookie.com/embed/${v.videoId}" allowfullscreen loading="lazy"></iframe>`}));}
  else box.append(h('a',{class:'btn',style:'display:inline-block;text-decoration:none;margin-top:8px',target:'_blank',rel:'noopener',href:'https://www.youtube.com/results?search_query='+encodeURIComponent(v.query)},'▶ Erklärvideo auf YouTube suchen'));
  body.append(box);
}
function merkStep(n){

/* ====== Übungs-Baustein mit 3 Niveaus ====== */
const NIV_NAMES={leicht:'leicht',standard:'standard',plus:'plus'};
function nivText(c){if(!c)return '';const p=Object.keys(NIV_NAMES).filter(k=>c[k]).map(k=>`${c[k]}× ${NIV_NAMES[k]}`);return p.join(', ');}
function practice(body,n,gens,need,done){
  let niv='leicht',solved=0,fin=false;
  state.niv=state.niv||{};const cnts={leicht:0,standard:0,plus:0,...(state.niv[n]||{})};
  const tabs=h('div',{class:'tabs'}),area=h('div'),cnt=h('div',{class:'muted'});
  const names={leicht:'🟢 leicht',standard:'🟡 standard',plus:'🔴 plus'};
  Object.keys(names).forEach(k=>{const t=h('button',{class:'tab'+(k===niv?' on':''),type:'button'},names[k]);t.addEventListener('click',()=>{niv=k;[...tabs.children].forEach(x=>x.classList.remove('on'));t.classList.add('on');newTask();});tabs.append(t);});
  body.append(h('p',{class:'muted'},`Löse mindestens ${need} Aufgaben richtig. Wähle dein Niveau – du kannst jederzeit wechseln. Eine Aufgabe zählt, wenn du sie ohne Lösungsweg schaffst (Auswahlaufgaben im 1. Versuch, Rechenaufgaben spätestens im 2. Versuch). Tipps sind erlaubt.`),tabs,area,cnt);
  const upd=()=>{cnt.textContent=`✓ ${solved} von ${need} gezählten Aufgaben gelöst`;};
  function newTask(){
    const t=gens[niv]();let tries=0,hintN=0,ok=false,solShown=false;const tNiv=niv;
    if(t.prompt&&t.prompt.includes('<svg')&&!t.exact)t.prompt+='<p class="muted" style="text-align:center;margin:0">Skizze nicht maßstabsgetreu</p>';
    area.innerHTML='';
    const q=h('div'),hints=h('div'),sol=h('div'),act=h('div');
    area.append(q,act,hints,sol);
    const solveBtn=h('button',{class:'btn sec',type:'button',style:'display:none'},'Lösungsweg anzeigen');
    const hintBtn=h('button',{class:'btn sec',type:'button'},'💡 Tipp');
    const nxt=h('button',{class:'btn',type:'button',style:'display:none'},'Nächste Aufgabe →');
    const showSol=()=>{sol.innerHTML='';sol.append(h('div',{class:'sol',html:t.solution}));};
    hintBtn.addEventListener('click',()=>{if(hintN<t.hints.length){hints.append(h('div',{class:'hint',html:'💡 '+t.hints[hintN++]}));}if(hintN>=t.hints.length)hintBtn.disabled=true;});
    solveBtn.addEventListener('click',()=>{solShown=true;showSol();nxt.style.display='';solveBtn.disabled=true;hintBtn.disabled=true;q.querySelectorAll('input,button').forEach(x=>x.disabled=true);});
    nxt.addEventListener('click',newTask);
    const onOk=()=>{if(ok||solShown)return;ok=true;
      const counts=t.kind==='mc'?tries===0:tries<=1;
      if(counts){solved++;cnts[tNiv]++;state.niv[n]={...cnts};save();upd();}
      else area.append(h('div',{class:'fb','aria-live':'polite'},'Richtig – diese Aufgabe zählt aber nicht, weil du mehrere Versuche gebraucht hast. Schau dir den Lösungsweg an und probiere die nächste.'));
      showSol();nxt.style.display='';hintBtn.disabled=true;solveBtn.style.display='none';
      if(solved>=need&&!fin){fin=true;area.append(h('div',{class:'fb ok'},'🎉 Geschafft! Du kannst unten mit dem Exit-Ticket weitermachen oder weiter üben.'));done();}};
    const onBad=()=>{tries++;if(tries>=2||t.kind==='mc')solveBtn.style.display='';};
    q.append(h('div',{html:t.prompt}));
    if(t.kind==='mc')mc(q,{q:t.question,options:t.options,correct:t.correct,hint:t.badHint},onOk,onBad);
    else numQ(q,{q:t.question,answer:t.answer,tol:t.tol,unit:t.unit,hint:t.badHint},onOk,onBad);
    act.append(hintBtn,solveBtn,nxt);
  }
  upd();newTask();
}

/* ====== Exit-Ticket ====== */
// Kontrollcode: Plausibilitätscheck (Station, Punktzahl, Datum) – kein Manipulationsschutz
function codeFor(n,score,d){return String(((n*7919)+(score*104729)+((d.getMonth()+1)*31+d.getDate())*131)%9000+1000);}
// pools: pro Frage ein Array von Varianten; correct ist immer options[0] (Anzeige wird gemischt)
function exitTicket(body,n,pools,done){
  let idx=0,score=0,qs=[],log=[];
  const box=h('div');body.append(box);
  function start(){idx=0;score=0;log=[];qs=shuffle(pools.map(p=>pick(p)));show();}
  function show(){
    box.innerHTML='';
    if(idx>=qs.length)return finish();
    const q=qs[idx];
    box.append(h('p',{class:'muted'},`Frage ${idx+1} von ${qs.length} · Du hast pro Frage nur einen Versuch.`));
    const qb=h('div',{class:'q'},h('p',{class:'qt',html:q.q}));
    const list=h('div',{class:'opts'}),fb=h('div',{class:'fb','aria-live':'polite'});
    shuffle(q.options.map((_,i)=>i)).forEach(i=>{
      const b=h('button',{class:'opt',type:'button',html:q.options[i]});
      b.addEventListener('click',()=>{
        if(b.disabled)return;[...list.children].forEach(x=>x.disabled=true);
        const ok=i===0;if(ok)score++;log.push({q,chosen:i,ok});
        b.classList.add(ok?'ok':'bad');fb.className='fb '+(ok?'ok':'bad');fb.textContent=ok?'✓ Richtig.':'✗ Leider falsch. Die Lösung siehst du in der Auswertung.';
        nextBtn(box,idx<qs.length-1?'Weiter →':'Auswerten',()=>{idx++;show();});
      });
      list.append(b);
    });
    qb.append(list,fb);box.append(qb);
  }
  function finish(){
    const pass=score>=2;
    box.append(h('h3',{},`Ergebnis: ${score} von ${qs.length}`));
    const rev=h('div',{class:'card',style:'margin:8px 0'},h('p',{class:'qt'},'Auswertung'));
    log.forEach((e,k)=>rev.append(h('div',{class:'q'},
      h('div',{html:`<b>${k+1}.</b> ${e.q.q}`}),
      h('div',{class:e.ok?'fb ok':'fb bad',html:(e.ok?'✓ ':'✗ Deine Antwort: '+e.q.options[e.chosen]+'<br>Richtig: ')+e.q.options[0]}),
      h('div',{class:'muted',html:e.q.explain}))));
    box.append(rev);
    if(pass){
      const d=new Date(),code=codeFor(n,score,d),nv=nivText(state.niv&&state.niv[n]);
      state[n]={score,date:d.toLocaleDateString('de-DE'),code,niv:nv};save();
      box.append(h('div',{class:'checkin'},h('div',{html:`<b>Station ${n} geschafft!</b> – ${STATIONS[n].title}`}),h('div',{},`Exit-Ticket: ${score} von ${qs.length} · Datum: ${state[n].date}`),nv?h('div',{},`Geübt: ${nv}`):null,h('div',{html:`Kontrollcode: <span class="code">${code}</span>`}),h('div',{class:'muted'},'Zeige diese Karte deiner Lehrkraft (oder mache einen Screenshot).')));
      done();
    }else{
      box.append(h('p',{},'Noch nicht ganz. Lies die Auswertung, schau dir die Erklärungen oben noch einmal an und übe weiter. Beim nächsten Versuch bekommst du neue Fragen.'));
      nextBtn(box,'Exit-Ticket wiederholen',start);
    }
  }
  start();
}

/* ====== Generatoren Station 1 ====== */
const SETS=[['a','b','c'],['p','q','r'],['x','y','z'],['d','e','f'],['k','l','m']];

const TRIPLES=[[3,4,5],[5,12,13],[6,8,10],[8,15,17],[7,24,25],[9,12,15],[20,21,29],[9,40,41]];

/* ====== Generatoren Station 2 ====== */
function s2solution(isHyp,a,b,c,u){

  const b2=c*c-a*a;return `<div>Kathete gesucht: b² = c² − a²</div><div>b² = ${fmt(c)}² − ${fmt(a)}² = ${r(c*c)} − ${r(a*a)} = ${r(b2)}</div><div>b = √${r(b2)} ≈ <b>${r(Math.sqrt(b2))} ${u}</b></div>`;
}
function s2task(vals,u){

    badHint:isHyp?'Hypotenuse: c² = a² + b² – danach die Wurzel ziehen.':'Kathete: b² = c² − a² – danach die Wurzel ziehen.',
    hints:['Wo ist der rechte Winkel? Welche Seite ist die Hypotenuse?',isHyp?'Rechne c² = a² + b².':'Rechne b² = c² − a². Das Quadrat der Hypotenuse steht vorne, davon wird das Quadrat der bekannten Kathete abgezogen.','Am Ende die Wurzel ziehen (Taschenrechner).'],
    solution:s2solution(isHyp,a,b,c,u)};

function s2leicht(){

function s2standard(){
  if(Math.random()<.35)return s2winkel();

  if(isHyp){const a=Math.round(rnd(20,150))/10,b=Math.round(rnd(20,150))/10;return s2task([a,b,0,true],u);}
  const c=Math.round(rnd(60,200))/10,a=Math.round(rnd(.3*c*10,.9*c*10))/10;return s2task([a,0,c,false],u);
}
function s2plus(){
  const w=rint(0,4);
  if(w===4)return s2winkel();
  if(w===0){const L=Math.round(rnd(35,65))/10,x=Math.round(rnd(8,22))/10,ans=Math.sqrt(L*L-x*x);
    return {kind:'num',prompt:'',unit:'m',question:`Eine ${fmt(L)} m lange Leiter lehnt an einer senkrechten Wand. Der Fuß der Leiter ist ${fmt(x)} m von der Wand entfernt. Wie hoch reicht die Leiter an der Wand?`,answer:Math.round(ans*100)/100,tol:.0051,
      badHint:'Die Leiter ist die Hypotenuse. Gesucht ist eine Kathete: Höhe² = Leiter² − Abstand².',hints:['Skizziere Wand, Boden und Leiter. Wo ist der rechte Winkel?','Die Leiter liegt dem rechten Winkel gegenüber ⇒ Hypotenuse.'],
      solution:`<div>Höhe h: h² = ${fmt(L)}² − ${fmt(x)}² = ${fmt(L*L)} − ${fmt(x*x)} = ${fmt(L*L-x*x)}</div><div>h = √${fmt(L*L-x*x)} ≈ <b>${fmt(ans)} m</b></div>`};}
  if(w===1){const l=rint(8,40),b=rint(5,l-1),ans=Math.sqrt(l*l+b*b);
    return {kind:'num',prompt:'',unit:'cm',question:`Ein Rechteck ist ${l} cm lang und ${b} cm breit. Wie lang ist seine Diagonale?`,answer:Math.round(ans*100)/100,tol:.0051,
      badHint:'Die Diagonale teilt das Rechteck in zwei rechtwinklige Dreiecke – sie ist die Hypotenuse.',hints:['Zeichne das Rechteck mit einer Diagonale.','Länge und Breite sind die Katheten.'],
      solution:`<div>d² = ${l}² + ${b}² = ${l*l} + ${b*b} = ${l*l+b*b}</div><div>d = √${l*l+b*b} ≈ <b>${fmt(ans)} cm</b></div>`};}
  if(w===2){const s=rint(4,14),g=rint(1,s-1)*2,ans=Math.sqrt(s*s-(g/2)*(g/2));

      badHint:'Die Höhe halbiert die Basis. So entsteht ein rechtwinkliges Teildreieck mit dem Schenkel als Hypotenuse.',hints:['Zeichne die Höhe ein und markiere den rechten Winkel.',`Die halbe Basis beträgt ${g/2} cm.`],
      solution:`<div>h² = ${s}² − ${g/2}² = ${s*s} − ${g*g/4} = ${s*s-g*g/4}</div><div>h = √${s*s-g*g/4} ≈ <b>${fmt(ans)} cm</b></div>`};}
  const s=rint(3,20),ans=Math.sqrt(2)*s;

    badHint:'Die Diagonale ist die Hypotenuse eines rechtwinkligen Dreiecks mit zwei gleich langen Katheten.',hints:['Zeichne das Quadrat mit einer Diagonale.'],
    solution:`<div>d² = ${s}² + ${s}² = ${2*s*s}</div><div>d = √${2*s*s} ≈ <b>${fmt(ans)} cm</b></div>`};

    if(r90>=3&&!showA){showA=true;angBox.style.display='';fb.className='fb';fb.innerHTML='Neu: Jetzt kannst du den Winkel γ verändern. Trage mindestens 2 Messungen mit einem Winkel ungleich 90° ein.';}
    go.disabled=!(r90>=3&&rO>=2);
    if(!go.disabled)fb.innerHTML='Gut! Vergleiche in der Tabelle die Spalten „a² + b²“ und „c²“. Was fällt dir auf? Klicke dann auf „Fertig – weiter“.';
  }

/* ====== Geführte Folge (Station 2) ====== */
function guided(body,items,done){
  let i=0;const box=h('div');body.append(box);
  function nxt(){
    if(i>=items.length){done();return;}
    const it=items[i++];
    if(it.html)box.append(h('div',{html:it.html}));
    const ok=()=>setTimeout(nxt,250);
    if(it.type==='mc')mc(box,it,ok);else if(it.type==='num')numQ(box,it,ok);else nxt();
  }
  nxt();
}


/* ====== Station 2: rechter Winkel bei α/β/γ, Einheiten ====== */
function s2winkel(){
  const t=pick(TRIPLES.filter(x=>x[2]<=25)),k=pick([5,10]);
  const v=t.map(x=>x*k);
  const [X,Y,Z]=shuffle(['A','B','C']);
  const gr={A:'α',B:'β',C:'γ'};
  const nm=[Y.toLowerCase(),Z.toLowerCase(),X.toLowerCase()];
  const unk=rint(0,2),given=[0,1,2].filter(i=>i!==unk);
  const fu=(cm,u)=>u==='cm'?fmt(cm,0):u==='dm'?fmt(cm/10,1):fmt(cm/100,2);
  const units=shuffle(['cm',pick(['dm','m'])]);
  const txt=given.map((i,j)=>`${nm[i]} = ${fu(v[i],units[j])} ${units[j]}`);
  const conv=given.map((i,j)=>units[j]==='cm'?null:`${fu(v[i],units[j])} ${units[j]} = ${v[i]} cm`).filter(Boolean);
  const prompt=triSvg({vertex:[X,Y,Z],rot:pick(ROTS),mirror:Math.random()<.5,L1:rnd(3,5),L2:rnd(2.5,4.5)})+`<p class="muted">Die Seite a liegt dem Eckpunkt A gegenüber, b liegt B gegenüber, c liegt C gegenüber.</p>`;
  let calc;
  if(unk===2){const g1=v[given[0]],g2=v[given[1]];calc=`${nm[2]}² = ${g1}² + ${g2}² = ${g1*g1} + ${g2*g2} = ${g1*g1+g2*g2}`;}
  else{const hy=v[2],kn=v[given.find(i=>i!==2)];calc=`${nm[unk]}² = ${hy}² − ${kn}² = ${hy*hy} − ${kn*kn} = ${hy*hy-kn*kn}`;}
  return {kind:'num',unit:'cm',prompt,tol:.001,answer:v[unk],
    question:`Im Dreieck ABC ist ${gr[X]} = 90°. Es gilt ${txt.join(' und ')}. Berechne ${nm[unk]} in cm.`,
    badHint:'Welche Seite liegt dem rechten Winkel gegenüber? Sind alle Längen in derselben Einheit?',
    hints:[`Der rechte Winkel liegt bei ${X}. Die Hypotenuse liegt gegenüber: ${nm[2]}.`,'Rechne zuerst alle Längen in cm um.'],
    solution:`<div>Rechter Winkel bei ${X} (${gr[X]} = 90°) ⇒ Hypotenuse <b>${nm[2]}</b></div>${conv.map(c=>`<div>${c}</div>`).join('')}<div>${calc}</div><div>${nm[unk]} = √${unk===2?v[unk]*v[unk]:v[unk]*v[unk]} = <b>${v[unk]} cm</b></div>`};
}

function trianglePlot(c){
  const a=3,b=4,g=Math.acos((a*a+b*b-c*c)/(2*a*b)),A=[b*Math.cos(g),-b*Math.sin(g)],B=[a,0],C=[0,0];

const A9MAX=A9.reduce((s,t)=>s+t.pts,0),A9PASS=Math.ceil(A9MAX/2);
const ST_SHORT={1:'Satz des Pythagoras',2:'Seitenlängen berechnen',3:'Umkehrung',4:'Ebene Figuren',5:'Extremwerte',6:'Körper',7:'Koordinatensystem',8:'Strecken in Abhängigkeit von x'};
function abschluss(body,done){
  const box=h('div');body.append(box);let tasks=[],idx=0;
  function start(){tasks=A9.map(a=>({...a.gen(),st:a.st,pts:a.pts}));idx=0;show();}
  function show(){
    box.innerHTML='';if(idx>=tasks.length)return finish();
    const t=tasks[idx];
    box.append(h('div',{class:'pb'},h('i',{style:`width:${idx/tasks.length*100}%`})),
      h('p',{class:'muted'},`Aufgabe ${idx+1} von ${tasks.length} · ${t.pts} ${t.pts===1?'Punkt':'Punkte'} · Du hast nur einen Versuch. Ob deine Antwort stimmt, siehst du in der Auswertung.`));
    if(t.prompt)box.append(h('div',{html:t.prompt+(t.prompt.includes('<svg')&&!t.exact?'<p class="muted" style="text-align:center;margin:0">Skizze nicht maßstabsgetreu</p>':'')}));
    const qb=h('div',{class:'q'},h('p',{class:'qt',html:t.question}));box.append(qb);
    const nxt=()=>nextBtn(box,idx<tasks.length-1?'Weiter →':'Auswerten',()=>{idx++;show();});
    if(t.kind==='mc'){
      const list=h('div',{class:'opts'});
      shuffle(t.options.map((_,i)=>i)).forEach(i=>{const b=h('button',{class:'opt',type:'button',html:t.options[i]});
        b.addEventListener('click',()=>{if(b.disabled)return;[...list.children].forEach(x=>x.disabled=true);b.classList.add('sel');t.given=t.options[i];t.ok=i===t.correct;nxt();});list.append(b);});
      qb.append(list);
    }else{
      const inp=h('input',{class:'num',type:'text',inputmode:'decimal',autocomplete:'off',placeholder:'Ergebnis'}),fb=h('div',{class:'fb','aria-live':'polite'});
      const btn=h('button',{class:'btn',type:'button'},'Antwort abgeben');
      const sub=()=>{if(inp.disabled)return;const v=parseNum(inp.value);if(isNaN(v)){fb.className='fb bad';fb.textContent='Bitte eine Zahl eingeben (z. B. 12,5).';return;}
        inp.disabled=true;btn.disabled=true;fb.className='fb';fb.textContent='Antwort gespeichert.';t.given=nf(v)+(t.unit?' '+t.unit:'');t.ok=Math.abs(v-t.answer)<=t.tol;nxt();};
      btn.addEventListener('click',sub);inp.addEventListener('keydown',e=>{if(e.key==='Enter')sub();});
      qb.append(h('div',{},inp,' ',t.unit||'',' ',btn),fb);setTimeout(()=>inp.focus(),50);
    }
    if(idx>0)box.scrollIntoView({behavior:'smooth',block:'start'});
  }
  function finish(){
    const score=tasks.reduce((s,t)=>s+(t.ok?t.pts:0),0),pass=score>=A9PASS;
    box.append(h('h3',{},`Ergebnis: ${score} von ${A9MAX} Punkten`));
    const per={};tasks.forEach(t=>{per[t.st]=per[t.st]||{p:0,m:0};per[t.st].m+=t.pts;if(t.ok)per[t.st].p+=t.pts;});
    const tb=h('table',{class:'t'},h('tr',{},h('th',{},'Station'),h('th',{},'Punkte'),h('th',{},'Empfehlung')));
    const weak=[];Object.keys(per).forEach(k=>{const v=per[k],full=v.p===v.m;if(!full)weak.push(k);
      tb.append(h('tr',{},h('td',{style:'text-align:left'},`${k}: ${ST_SHORT[k]}`),h('td',{},`${v.p} / ${v.m}`),h('td',{class:full?'fb ok':'fb bad'},full?'✓ sicher':`Wiederhole Station ${k} (Merkkasten, Üben)`)));});
    box.append(h('div',{class:'card',style:'margin:8px 0'},h('p',{class:'qt'},'Auswertung nach Stationen'),tb,
      h('p',{class:'muted',style:'margin-bottom:0'},weak.length?`Tipp: Lies zuerst die Merkkästen der Stationen ${weak.join(', ')} im Merkheft nach und löse dort noch einmal Übungsaufgaben.`:'Hervorragend – alle Stationen sicher!')));
    const rev=h('div',{class:'card',style:'margin:8px 0'},h('p',{class:'qt'},'Alle Aufgaben mit Lösungsweg'));
    tasks.forEach((t,k)=>{const det=h('details',{},h('summary',{html:`<b>${k+1}.</b> ${t.ok?'✓':'✗'} Station ${t.st} · ${t.ok?t.pts:0} / ${t.pts} ${t.pts===1?'Punkt':'Punkte'}`}),
      h('div',{html:t.question}),h('div',{class:t.ok?'fb ok':'fb bad',html:`Deine Antwort: ${t.given}`+(t.ok?'':`<br>Richtig: ${t.kind==='mc'?t.options[t.correct]:nf(t.answer)+(t.unit?' '+t.unit:'')}`)}),h('div',{class:'sol',html:t.solution}));
      if(!t.ok)det.open=true;rev.append(h('div',{class:'q'},det));});
    box.append(rev);
    if(pass){
      const d=new Date(),code=codeFor(9,score,d);
      state[9]={score,date:d.toLocaleDateString('de-DE'),code,niv:''};save();
      box.append(h('div',{class:'checkin'},h('div',{html:`<b>Abschluss-Check geschafft!</b> – Rechtwinklige Dreiecke`}),h('div',{},`Ergebnis: ${score} von ${A9MAX} Punkten · Datum: ${state[9].date}`),h('div',{html:`Kontrollcode: <span class="code">${code}</span>`}),h('div',{class:'muted'},'Zeige diese Karte deiner Lehrkraft (oder mache einen Screenshot).')));
      done();
    }else{
      box.append(h('p',{},`Du brauchst mindestens ${A9PASS} Punkte. Wiederhole die empfohlenen Stationen und starte den Abschluss-Check dann neu. Du bekommst neue Aufgaben.`));
      nextBtn(box,'Abschluss-Check wiederholen',start);
    }
    box.scrollIntoView({behavior:'smooth',block:'start'});
  }
  start();
}

    {q:`Für die Länge der Strecken gilt ${LQP}² = 1,25(x − 2)² + 5 (in cm²). Was folgt daraus?`,options:[`Für x = 2 ist die Strecke am kürzesten: √5 cm ≈ 2,24 cm`,`Für x = −2 ist die Strecke am kürzesten: √5 cm ≈ 2,24 cm`,`Für x = 2 ist die Strecke am kürzesten: 5 cm`,'Für x = 2 ist die Strecke am längsten.'],explain:'(x − 2)² ≥ 0 und für x = 2 gleich 0. Der kleinste Wert von |QPn|² ist 5, die kürzeste Strecke also √5 cm ≈ 2,24 cm.'}],
   [{q:`Vereinfache ${LQP}² = (x − 4)² + (x + 2)².`,options:['2x² − 4x + 20','2x² − 12x + 20','x² − 4x + 20','2x² + 20'],explain:'(x − 4)² = x² − 8x + 16 und (x + 2)² = x² + 4x + 4. Zusammen: 2x² − 4x + 20.'},
    {q:`Vereinfache ${LQP}² = (x − 2)² + (0,5x + 1)².`,options:['1,25x² − 3x + 5','1,25x² − 5x + 5','0,25x² − 3x + 5','1,25x² + 5'],explain:'(x − 2)² = x² − 4x + 4 und (0,5x + 1)² = 0,25x² + x + 1. Zusammen: 1,25x² − 3x + 5.'}]
 ],done);}}
 ]},
9:{title:'Abschluss-Check',komp:'Alle Inhalte des Kapitels selbstständig anwenden und erkennen, welche Stationen du noch einmal wiederholen solltest.',
 steps:[
 {title:'Vorbereitung',render(body,done){
   body.append(h('div',{class:'info',html:`<b>So funktioniert der Abschluss-Check:</b><br>• ${A9.length} Aufgaben aus allen Stationen, insgesamt ${A9MAX} Punkte<br>• Für jede Aufgabe hast du <b>einen Versuch</b>. Ob deine Antwort stimmt, siehst du erst in der Auswertung.<br>• Bestanden ab <b>${A9PASS} Punkten</b> (50 %)<br>• Du brauchst: Taschenrechner, Stift und Papier für Nebenrechnungen. Rechne Ergebnisse auf zwei Nachkommastellen.<br>• Arbeite ohne Merkheft – so siehst du, was du wirklich kannst.<br>• Dauer: etwa 30 bis 40 Minuten`}));
   const tb=h('table',{class:'t'},h('tr',{},h('th',{},'Station'),h('th',{},'Aufgaben'),h('th',{},'Punkte')));
   Object.keys(ST_SHORT).forEach(k=>{const a=A9.filter(x=>x.st===+k);tb.append(h('tr',{},h('td',{style:'text-align:left'},`${k}: ${ST_SHORT[k]}`),h('td',{},String(a.length)),h('td',{},String(a.reduce((s,x)=>s+x.pts,0)))));});

 }},
 {title:'Abschluss-Check',render:abschluss}

/* ====== Ansichten ====== */
function unlocked(n){return TEACHER||n===1||!!state[n-1];}
function home(){
  app.innerHTML='';
  const doneN=Object.keys(state).filter(k=>STATIONS[k]).length;
  app.append(h('div',{class:'card'},h('h2',{},'Rechtwinklige Dreiecke'),
    h('p',{html:'Du erarbeitest dieses Kapitel selbstständig. Du entdeckst Regeln, schreibst Merkkästen (<span style="background:#fff7d6;padding:0 6px;border:1px solid #e0b400;border-radius:4px">✏️ Merkheft</span>) in dein Merkheft ab, übst auf deinem Niveau und schließt jede Station mit einem Exit-Ticket ab.'}),
    h('p',{class:'muted'},'Du brauchst: Merkheft, Stift, Taschenrechner, Geodreieck.'),
    h('div',{class:'pb'},h('i',{style:`width:${doneN/9*100}%`})),h('p',{class:'muted'},`${doneN} von 9 Stationen geschafft`)));
  const hasData=Object.keys(state).length>0;
  const list=h('div',{class:'stations'});
  Object.keys(STATIONS).forEach(k=>{const n=+k,st=STATIONS[n];const b=h('button',{class:'stn'+(state[n]?' ok':''),type:'button'},h('div',{class:'nr'},state[n]?'✓':String(n)),h('div',{},h('div',{class:'t'},st.title),h('div',{class:'s'},st.komp)));if(!unlocked(n))b.disabled=true;b.addEventListener('click',()=>station(n));list.append(b);});
  app.append(list);
  if(TEACHER)app.append(teacherCard());
  if(hasData)app.append(h('div',{class:'card'},h('p',{class:'muted',style:'margin-top:0'},'Arbeitest du an einem geteilten iPad? Dann setze am Ende deinen Fortschritt zurück, damit die nächste Person von vorne beginnt.'),
    h('button',{class:'btn sec',type:'button',onclick:()=>{if(confirm('Wirklich den gesamten Fortschritt auf diesem Gerät löschen? Check-in-Karten und Merkheft-Freischaltungen gehen verloren.')){state={};try{localStorage.removeItem(KEY);}catch(e){}home();}}},'🗑 Fortschritt zurücksetzen')));
  window.scrollTo(0,0);
}
function teacherCard(){
  const card=h('div',{class:'card'},h('h3',{},'Lehrkraft-Ansicht'),h('p',{class:'muted'},'Alle Stationen sind freigeschaltet. Gültige Kontrollcodes für das gewählte Datum:'));
  const inp=h('input',{type:'date',class:'num',style:'width:auto'}),out=h('div');
  const d0=new Date();inp.value=`${d0.getFullYear()}-${String(d0.getMonth()+1).padStart(2,'0')}-${String(d0.getDate()).padStart(2,'0')}`;
  const draw=()=>{const [y,m,d]=inp.value.split('-').map(Number);out.innerHTML='';if(!y)return;const dt=new Date(y,m-1,d);
    const t=h('table',{class:'t'},h('tr',{},h('th',{},'Station'),h('th',{},'2 von 3'),h('th',{},'3 von 3')));
    Object.keys(STATIONS).filter(k=>k!=='9').forEach(k=>t.append(h('tr',{},h('td',{},`${k}: ${STATIONS[k].title}`),h('td',{class:'code',style:'font-size:17px'},codeFor(+k,2,dt)),h('td',{class:'code',style:'font-size:17px'},codeFor(+k,3,dt)))));
    const t9=h('table',{class:'t'},h('tr',{},h('th',{},'Abschluss-Check: Punkte'),h('th',{},'Kontrollcode')));
    for(let sc=A9MAX;sc>=A9PASS;sc--)t9.append(h('tr',{},h('td',{},`${sc} von ${A9MAX}`),h('td',{class:'code',style:'font-size:17px'},codeFor(9,sc,dt))));
    out.append(t,h('p',{class:'muted',style:'margin:12px 0 0'},`Station 9 (Abschluss-Check, bestanden ab ${A9PASS} Punkten):`),t9);};
  inp.addEventListener('change',draw);draw();
  card.append(h('label',{},'Datum: ',inp),out);
  return card;
}
function station(n){
  const st=STATIONS[n];app.innerHTML='';
  app.append(h('div',{class:'card'},h('h2',{},`Station ${n}: ${st.title}`),h('p',{class:'muted',html:'<b>Ziel:</b> '+st.komp})));
  const list=h('div');app.append(list);
  state.prog=state.prog||{};
  // bereits erledigte Schritte (nach Neuladen) zusammengeklappt anzeigen, nicht noch einmal bearbeiten müssen
  let i=Math.min(state.prog[n]||0,st.steps.length-1);
  if(i===0&&state.niv){delete state.niv[n];save();}
  for(let k=0;k<i;k++){const step=st.steps[k],body=h('div');
    const show=h('button',{class:'btn sec',type:'button'},'Noch einmal ansehen');
    show.addEventListener('click',()=>{show.remove();step.render(body,()=>{});});
    list.append(h('section',{class:'step done'},h('h3',{},`${k+1}. ${step.title}`),h('p',{class:'muted',style:'margin:0'},'Bereits erledigt.'),show,body));}
  const setProg=v=>{if(v>=st.steps.length)delete state.prog[n];else state.prog[n]=v;save();};
  function next(){
    if(i>=st.steps.length){setProg(i);list.append(h('div',{class:'card'},h('button',{class:'btn',type:'button',onclick:home},'Zur Übersicht')));return;}
    const step=st.steps[i++];const body=h('div');const card=h('section',{class:'step'},h('h3',{},`${i}. ${step.title}`),body);list.append(card);
    const fin=once(()=>{card.classList.add('done');setProg(i);setTimeout(next,200);});
    step.render(body,fin);
    if(i>1)card.scrollIntoView({behavior:'smooth',block:'start'});
  }
  const startAt=i;next();if(startAt===0)window.scrollTo(0,0);
}
function merkheft(){
  app.innerHTML='';
  app.append(h('div',{class:'card'},h('h2',{},'📒 Merkheft-Einträge'),h('p',{class:'muted'},'Hier findest du alle Merkkästen der geschafften Stationen zum Nachlesen oder Ausdrucken.')));
  const ns=Object.keys(MERK).filter(k=>state[k]||TEACHER);
  if(!ns.length)app.append(h('div',{class:'card'},'Noch keine Einträge – schließe zuerst eine Station ab.'));
  ns.forEach(k=>app.append(h('div',{class:'merk'},h('span',{class:'tag'},`Station ${k}`),h('div',{html:MERK[k].html}))));
  if(ns.length)app.append(h('button',{class:'btn',type:'button',onclick:()=>{
    const pa=document.getElementById('printArea');pa.innerHTML='<h2>Merkheft-Einträge · Rechtwinklige Dreiecke</h2>'+ns.map(k=>`<div class="merk"><div class="tag">Station ${k}: ${MERK[k].title}</div>${MERK[k].html}</div>`).join('');
    document.body.classList.add('printing');const end=()=>document.body.classList.remove('printing');window.addEventListener('afterprint',end,{once:true});window.print();setTimeout(end,4000);
  }},'🖨 Drucken / Als PDF sichern'));
  window.scrollTo(0,0);
}
document.getElementById('bHome').addEventListener('click',home);
document.getElementById('bMerk').addEventListener('click',merkheft);
home();
</script>
