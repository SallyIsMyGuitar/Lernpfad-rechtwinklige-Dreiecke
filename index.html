 {n:'standard',q:`Bestimme für die Strecken aus Aufgabe 1 die kürzeste Streckenlänge ${len('QP<sub>0</sub>')} und die Koordinaten von P<sub>0</sub>.`,
  tip:`${len('QP<sub>n</sub>')}² = (x − 4)² + (0,5x + 2)². Ausmultiplizieren, dann quadratisch ergänzen.`,
  sol:`<div>${len('QP<sub>n</sub>')}² = [(x − 4)² + (0,5x + 2)²] LE² = (1,25x² − 6x + 20) LE²</div><div>= [1,25(x² − 4,8x + 2,4² − 2,4²) + 20] LE² = [1,25(x − 2,4)² + 12,8] LE²</div><div>Für x = 2,4: ${len('QP<sub>0</sub>')} = √12,8 LE ≈ <b>3,58 LE</b>; <b>P<sub>0</sub>(2,4 | 3,2)</b></div>`},
 {n:'standard',q:`Die Punkte C<sub>n</sub>(x | x + 1) liegen auf der Geraden g. Mit ${ptS('A',0,0)} und ${ptS('B',6,0)} bilden sie Dreiecke ABC<sub>n</sub>. Für welchen Wert von x ist das Dreieck gleichschenklig mit der Basis ${ov('AB')}? Berechne für dieses Dreieck die Schenkellänge und den Flächeninhalt.`,
  tip:`Setze ${len('AC<sub>n</sub>')}² = ${len('BC<sub>n</sub>')}².`,
  sol:`<div>${len('AC<sub>n</sub>')}² = x² + (x + 1)²; ${len('BC<sub>n</sub>')}² = (x − 6)² + (x + 1)²</div><div>x² = (x − 6)² ⇒ 0 = −12x + 36 ⇒ <b>x = 3</b>; C<sub>0</sub>(3 | 4)</div><div>Schenkel: ${len('AC<sub>0</sub>')} = ${sq('3² + 4²')} LE = <b>5 LE</b></div><div>A = ${HALF} · 6 LE · 4 LE = <b>12 FE</b></div>`},
 {n:'plus',q:`${ptS('A',2,-1)} und die Punkte C<sub>n</sub>(x | −0,5x + 4) auf der Geraden g sind gegenüberliegende Eckpunkte von Rauten AB<sub>n</sub>C<sub>n</sub>D<sub>n</sub>. Die Diagonale ${ov('B<sub>n</sub>D<sub>n</sub>')} ist immer 4 LE lang. Für welche Werte von x ist die Raute ein Quadrat? Gib die Seitenlänge des Quadrats an.`,
  tip:`Eine Raute ist ein Quadrat, wenn beide Diagonalen gleich lang sind: ${len('AC<sub>n</sub>')} = 4 LE.`,
  sol:`<div>${len('AC<sub>n</sub>')}² = [(x − 2)² + (−0,5x + 5)²] LE² = (1,25x² − 9x + 29) LE²</div><div>1,25x² − 9x + 29 = 16 ⇒ 1,25x² − 9x + 13 = 0</div><div>x = ${fr('9 ± √(81 − 65)','2,5')} = ${fr('9 ± 4','2,5')} ⇒ <b>x = 2</b> oder <b>x = 5,2</b></div><div>Seitenlänge: a² + a² = (4 LE)² ⇒ a = 2√2 LE ≈ <b>2,83 LE</b></div>`},
 {n:'plus',q:`Die Punkte B<sub>n</sub>(x | 2x − 3) liegen auf der Geraden g. Gegeben ist ${ptS('A',5,6)}. Berechne die kürzeste Streckenlänge ${len('AB<sub>0</sub>')} und zeige, dass ${ov('AB<sub>0</sub>')} senkrecht auf g steht.`,
  tip:`Nach der quadratischen Ergänzung: Prüfe, ob ${vec('AB<sub>0</sub>')} und der Richtungsvektor ${cvec(1,2)} von g senkrecht stehen (Skalarprodukt 0 oder Steigungen).`,
  sol:`<div>${len('AB<sub>n</sub>')}² = [(x − 5)² + (2x − 9)²] LE² = (5x² − 46x + 106) LE² = [5(x − 4,6)² + 0,2] LE²</div><div>x = 4,6: B<sub>0</sub>(4,6 | 6,2); ${len('AB<sub>0</sub>')} = √0,2 LE ≈ <b>0,45 LE</b></div><div>${vec('AB<sub>0</sub>')} = ${cvec('−0,4','0,2')}: Steigung −0,5; g hat die Steigung 2; 2 · (−0,5) = −1 ⇒ <b>senkrecht</b></div>`}
],
9:[
 {n:'leicht',q:`Eine quadratische Holzplatte (2,30 m × 2,30 m, sehr dünn) soll durch eine 1,00 m breite und 2,10 m hohe Tür getragen werden. Geht das, wenn man sie schräg hält?`,
  tip:`Vergleiche die Seitenlänge der Platte mit der Diagonale der Türöffnung.`,
  sol:`<div>d² = (1,00 m)² + (2,10 m)² = 5,41 m² ⇒ d ≈ 2,33 m</div><div>2,30 m &lt; 2,33 m ⇒ <b>Ja</b>, die Platte passt schräg gerade hindurch.</div>`},
 {n:'standard',q:`Eine Rampe ist 6 m lang und überwindet einen Höhenunterschied von 50 cm. Wie lang ist die Rampe waagrecht gemessen? Wie groß ist ihre Steigung in Prozent?`,
  tip:`Die Rampe ist die Hypotenuse. Steigung = Höhenunterschied : waagrechte Länge.`,
  sol:`<div>w² = (6 m)² − (0,5 m)² = 35,75 m² ⇒ w ≈ <b>5,98 m</b></div><div>Steigung = 0,5 m : 5,98 m ≈ 0,084 = <b>8,4 %</b></div>`},
 {n:'standard',q:`Ein Kletterseil hängt von der 7 m hohen Hallendecke herab; 1 m davon liegt auf dem Boden. Wie weit kann man das Seil seitlich wegziehen, bis es gespannt gerade noch den Boden berührt?`,
  tip:`Das Seil ist insgesamt 8 m lang. Gespannt ist es die Hypotenuse, die Deckenhöhe eine Kathete.`,
  sol:`<div>Seillänge 7 m + 1 m = 8 m</div><div>x² = (8 m)² − (7 m)² = 15 m² ⇒ x ≈ <b>3,87 m</b></div>`},
 {n:'plus',q:`Wie weit kann man von einem 50 m hohen Aussichtsturm an der Küste bei klarer Sicht bis zum Horizont sehen? Rechne mit dem Erdradius r = 6370 km.`,
  tip:`Die Sichtlinie berührt die Erdkugel; dort steht sie senkrecht auf dem Erdradius. Hypotenuse: r + h.`,
  sol:`<div>h = 50 m = 0,05 km</div><div>s² = (r + h)² − r² = (6370,05 km)² − (6370 km)² ≈ 637 km²</div><div>s ≈ <b>25,2 km</b></div>`},
 {n:'plus',q:`Eine Wurzelspirale beginnt mit einem rechtwinkligen Dreieck mit zwei 1 cm langen Katheten. An die Hypotenuse wird jeweils ein neues rechtwinkliges Dreieck mit einer 1 cm langen Kathete angesetzt. Wie lang ist die Hypotenuse des n-ten Dreiecks? Das wievielte Dreieck hat eine √10 cm lange Hypotenuse?`,
  tip:`Berechne die ersten Hypotenusen: c<sub>1</sub>² = 1² + 1², c<sub>2</sub>² = c<sub>1</sub>² + 1², …`,
  sol:`<div>c<sub>1</sub> = √2 cm; c<sub>2</sub> = ${sq('2 + 1')} cm = √3 cm; c<sub>3</sub> = √4 cm = 2 cm; …</div><div>c<sub>n</sub> = <b>${sq('n + 1')} cm</b></div><div>√(n + 1) = √10 ⇒ <b>n = 9</b> (≈ 3,16 cm)</div>`}
],
10:[
 {n:'leicht',q:`In einem rechtwinkligen Dreieck (γ = 90°) sind die Hypotenusenabschnitte p = 4 cm und q = 9 cm. Berechne die Höhe h.`,
  tip:`Höhensatz: h² = p · q.`,
  sol:`<div>h² = 4 cm · 9 cm = 36 cm² ⇒ <b>h = 6 cm</b></div>`},
 {n:'leicht',q:`Im rechtwinkligen Dreieck ABC (γ = 90°) ist c = 20 cm und p = 5 cm. Berechne die Kathete a.`,
  tip:`Kathetensatz: a² = c · p.`,
  sol:`<div>a² = 20 cm · 5 cm = 100 cm² ⇒ <b>a = 10 cm</b></div>`},
 {n:'standard',q:`Im rechtwinkligen Dreieck ABC (γ = 90°) ist a = 12 cm und c = 15 cm. Berechne p, q, h und b.`,
  tip:`Mit a² = c · p erhältst du p, dann q = c − p.`,
  sol:`<div>p = a² : c = 144 cm² : 15 cm = <b>9,6 cm</b>; q = 15 cm − 9,6 cm = <b>5,4 cm</b></div><div>h² = 9,6 cm · 5,4 cm = 51,84 cm² ⇒ <b>h = 7,2 cm</b></div><div>b² = 15 cm · 5,4 cm = 81 cm² ⇒ <b>b = 9 cm</b></div>`},
 {n:'plus',q:`Ein Rechteck ist 9 cm lang und 4 cm breit. Beschreibe, wie man mit dem Höhensatz ein flächengleiches Quadrat konstruieren kann. Wie lang ist seine Seite?`,
  tip:`Setze p = 9 cm und q = 4 cm aneinander. Über der Gesamtstrecke liegt ein rechtwinkliges Dreieck mit der Spitze auf dem Thaleskreis.`,
  sol:`<div>1. Strecke ${ov('AB')} mit 9 cm + 4 cm = 13 cm zeichnen, Teilpunkt D markieren.</div><div>2. Thaleskreis über ${ov('AB')} zeichnen.</div><div>3. Senkrechte zu ${ov('AB')} in D; Schnittpunkt mit dem Thaleskreis ist C.</div><div>4. ${ov('CD')} ist die Höhe h: h² = 9 cm · 4 cm = 36 cm² ⇒ <b>h = 6 cm</b> = Seitenlänge des Quadrats.</div>`}
]
};
const XNIV={leicht:'🟢 leicht',standard:'🟡 standard',plus:'🔴 plus'};
function extraList(n){
  const box=h('div');
  EXTRA[n].forEach((a,i)=>box.append(h('div',{class:'xa'},
    h('p',{class:'xh',html:`<b>Aufgabe ${i+1}</b> <span class="xniv">${XNIV[a.n]}</span>`}),h('div',{html:a.q}),
    h('details',{class:'xtip'},h('summary',{},'💡 Tipp anzeigen'),h('div',{class:'hint',html:a.tip})),
    h('details',{class:'xsol'},h('summary',{},'✅ Lösung anzeigen'),h('div',{class:'sol',html:a.sol})))));
  return box;
}
function extraTitle(k){return STATIONS[k].zusatz?STATIONS[k].title:k==='9'||k===9?'Gemischte Aufgaben (alle Stationen)':`Station ${k}: ${STATIONS[k].title}`;}
function extraBox(n){
  return h('details',{class:'card xbox'},h('summary',{html:`<b>🧩 Zusatzaufgaben</b> <span class="muted">(${EXTRA[n].length} Aufgaben, freiwillig)</span>`}),
    h('p',{class:'muted'},'Rechne im Heft. Öffne erst den Tipp, wenn du nicht weiterkommst, und vergleiche danach mit der Lösung. Die Aufgaben zählen nicht für das Exit-Ticket.'),extraList(n));
}
function extraPage(){
  app.innerHTML='';
  app.append(h('div',{class:'card'},h('h2',{},'🧩 Zusatzaufgaben'),h('p',{class:'muted'},'Freiwillige Aufgaben zum Weiterüben – zu jeder freigeschalteten Station. Rechne im Heft, öffne bei Bedarf den Tipp und vergleiche mit der Lösung.')));
  const ks=Object.keys(EXTRA).filter(k=>unlocked(+k));
  ks.forEach(k=>app.append(h('div',{class:'card'},h('h3',{},extraTitle(k)),extraList(k))));
  const cb=h('input',{type:'checkbox',id:'xprSol'});
  app.append(h('div',{class:'card'},h('label',{for:'xprSol',style:'cursor:pointer'},cb,' Tipps und Lösungen mitdrucken'),h('br'),h('button',{class:'btn',type:'button',onclick:()=>{
    const pa=document.getElementById('printArea'),ws=cb.checked;
    pa.innerHTML='<h2>Zusatzaufgaben · Rechtwinklige Dreiecke</h2>'+ks.map(k=>`<h3>${extraTitle(k)}</h3>`+EXTRA[k].map((a,i)=>`<div class="xa"><p><b>Aufgabe ${i+1}</b> (${a.n})</p><div>${a.q}</div>${ws?`<div class="hint">Tipp: ${a.tip}</div><div class="sol">${a.sol}</div>`:''}</div>`).join('')).join('');
    document.body.classList.add('printing');const end=()=>document.body.classList.remove('printing');window.addEventListener('afterprint',end,{once:true});window.print();setTimeout(end,4000);
  }},'🖨 Drucken / Als PDF sichern')));
  window.scrollTo(0,0);
}

/* ====== Ansichten ====== */
function unlocked(n){return TEACHER||n===1||(n===10?!!state[3]:!!state[n-1]);}
function home(){
  app.innerHTML='';
  const doneN=Object.keys(state).filter(k=>STATIONS[k]&&!STATIONS[k].zusatz).length;
  app.append(h('div',{class:'card'},h('h2',{},'Rechtwinklige Dreiecke'),
    h('p',{html:'Du erarbeitest dieses Kapitel selbstständig. Du entdeckst Regeln, schreibst Merkkästen (<span style="background:#fff7d6;padding:0 6px;border:1px solid #e0b400;border-radius:4px">✏️ Merkheft</span>) in dein Merkheft ab, übst auf deinem Niveau und schließt jede Station mit einem Exit-Ticket ab.'}),
    h('p',{class:'muted'},'Du brauchst: Merkheft, Stift, Taschenrechner, Geodreieck.'),
    h('div',{class:'pb'},h('i',{style:`width:${doneN/9*100}%`})),h('p',{class:'muted'},`${doneN} von 9 Stationen geschafft`)));
  const hasData=Object.keys(state).length>0;
  const list=h('div',{class:'stations'});
  Object.keys(STATIONS).forEach(k=>{const n=+k,st=STATIONS[n];if(st.zusatz)list.append(h('p',{class:'muted',style:'margin:14px 0 4px'},'Zusatz (freiwillig, ab Station 3 freigeschaltet, zählt nicht für den Abschluss-Check):'));const b=h('button',{class:'stn'+(state[n]?' ok':''),type:'button'},h('div',{class:'nr'},state[n]?'✓':(st.zusatz?'Z':String(n))),h('div',{},h('div',{class:'t'},st.title),h('div',{class:'s'},st.komp)));if(!unlocked(n))b.disabled=true;b.addEventListener('click',()=>station(n));list.append(b);});
  app.append(list);
  if(TEACHER)app.append(teacherCard());
  if(hasData)app.append(h('div',{class:'card'},h('p',{class:'muted',style:'margin-top:0'},'Arbeitest du an einem geteilten iPad? Dann setze am Ende deinen Fortschritt zurück, damit die nächste Person von vorne beginnt.'),
    h('button',{class:'btn sec',type:'button',onclick:()=>{if(confirm('Wirklich den gesamten Fortschritt auf diesem Gerät löschen? Check-in-Karten und Merkheft-Freischaltungen gehen verloren.')){state={};try{localStorage.removeItem(KEY);}catch(e){}home();}}},'🗑 Fortschritt zurücksetzen')));
  window.scrollTo(0,0);
}
function teacherCard(){
  const card=h('div',{class:'card'},h('h3',{},'Lehrkraft-Ansicht'),h('p',{class:'muted'},'Alle Stationen sind freigeschaltet. Gültige Kontrollcodes für das gewählte Datum:'));
  const inp=h('input',{type:'date',class:'num',style:'width:auto'}),out=h('div');
  const d0=new Date();inp.value=`${d0.getFullYear()}-${String(d0.getMonth()+1).padStart(2,'0')}-${String(d0.getDate()).padStart(2,'0')}`;
  const draw=()=>{const [y,m,d]=inp.value.split('-').map(Number);out.innerHTML='';if(!y)return;const dt=new Date(y,m-1,d);
    const t=h('table',{class:'t'},h('tr',{},h('th',{},'Station'),h('th',{},'2 von 3'),h('th',{},'3 von 3')));
    Object.keys(STATIONS).filter(k=>k!=='9').forEach(k=>t.append(h('tr',{},h('td',{},`${k}: ${STATIONS[k].title}`),h('td',{class:'code',style:'font-size:17px'},codeFor(+k,2,dt)),h('td',{class:'code',style:'font-size:17px'},codeFor(+k,3,dt)))));
    const t9=h('table',{class:'t'},h('tr',{},h('th',{},'Abschluss-Check: Punkte'),h('th',{},'Kontrollcode')));
    for(let sc=A9MAX;sc>=A9PASS;sc--)t9.append(h('tr',{},h('td',{},`${sc} von ${A9MAX}`),h('td',{class:'code',style:'font-size:17px'},codeFor(9,sc,dt))));
    out.append(t,h('p',{class:'muted',style:'margin:12px 0 0'},`Station 9 (Abschluss-Check, bestanden ab ${A9PASS} Punkten):`),t9);};
  inp.addEventListener('change',draw);draw();
  card.append(h('label',{},'Datum: ',inp),out);
  return card;
}
function station(n){
  const st=STATIONS[n];app.innerHTML='';
  app.append(h('div',{class:'card'},h('h2',{},st.zusatz?st.title:`Station ${n}: ${st.title}`),h('p',{class:'muted',html:'<b>Ziel:</b> '+st.komp})));
  const list=h('div');app.append(list);
  if(EXTRA[n])app.append(extraBox(n));
  state.prog=state.prog||{};
  // bereits erledigte Schritte (nach Neuladen) zusammengeklappt anzeigen, nicht noch einmal bearbeiten müssen
  let i=Math.min(state.prog[n]||0,st.steps.length-1);
  if(i===0&&state.niv){delete state.niv[n];save();}
  for(let k=0;k<i;k++){const step=st.steps[k],body=h('div');
    const show=h('button',{class:'btn sec',type:'button'},'Noch einmal ansehen');
    show.addEventListener('click',()=>{show.remove();step.render(body,()=>{});});
    list.append(h('section',{class:'step done'},h('h3',{},`${k+1}. ${step.title}`),h('p',{class:'muted',style:'margin:0'},'Bereits erledigt.'),show,body));}
  const setProg=v=>{if(v>=st.steps.length)delete state.prog[n];else state.prog[n]=v;save();};
  function next(){
    if(i>=st.steps.length){setProg(i);list.append(h('div',{class:'card'},h('button',{class:'btn',type:'button',onclick:home},'Zur Übersicht')));return;}
    const step=st.steps[i++];const body=h('div');const card=h('section',{class:'step'},h('h3',{},`${i}. ${step.title}`),body);list.append(card);
    const fin=once(()=>{card.classList.add('done');setProg(i);setTimeout(next,200);});
    step.render(body,fin);
    if(i>1)card.scrollIntoView({behavior:'smooth',block:'start'});
  }
  const startAt=i;next();if(startAt===0)window.scrollTo(0,0);
}
function merkheft(){
  app.innerHTML='';
  app.append(h('div',{class:'card'},h('h2',{},'📒 Merkheft-Einträge'),h('p',{class:'muted'},'Hier findest du alle Merkkästen der geschafften Stationen zum Nachlesen oder Ausdrucken.')));
  const ns=Object.keys(MERK).filter(k=>state[k]||TEACHER);
  if(!ns.length)app.append(h('div',{class:'card'},'Noch keine Einträge – schließe zuerst eine Station ab.'));
  ns.forEach(k=>app.append(h('div',{class:'merk'},h('span',{class:'tag'},STATIONS[k].zusatz?'Zusatz':`Station ${k}`),h('div',{html:MERK[k].html}))));
  if(ns.length)app.append(h('button',{class:'btn',type:'button',onclick:()=>{
    const pa=document.getElementById('printArea');pa.innerHTML='<h2>Merkheft-Einträge · Rechtwinklige Dreiecke</h2>'+ns.map(k=>`<div class="merk"><div class="tag">${STATIONS[k].zusatz?'Zusatz':'Station '+k}: ${MERK[k].title}</div>${MERK[k].html}</div>`).join('');
    document.body.classList.add('printing');const end=()=>document.body.classList.remove('printing');window.addEventListener('afterprint',end,{once:true});window.print();setTimeout(end,4000);
  }},'🖨 Drucken / Als PDF sichern'));
  window.scrollTo(0,0);
}
document.getElementById('bHome').addEventListener('click',home);
document.getElementById('bMerk').addEventListener('click',merkheft);
document.getElementById('bExtra').addEventListener('click',extraPage);
home();
</script>
